  function updateWorld() {
    if (cat.dead) return;


    if (logTimer > 0) logTimer--;
    if (cat.attackTimer > 0) cat.attackTimer--;
    if (cat.attackCd > 0) cat.attackCd--;
    if (cat.dashTimer > 0) cat.dashTimer--;
    if (cat.dashCd > 0) cat.dashCd--;
    if (cat.invuln > 0) cat.invuln--;


    let mx = 0, my = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;


    const spd = cat.dashTimer > 0 ? 8.2 : 3.9;
    if (mx !== 0 || my !== 0) {
      const len = Math.hypot(mx, my);
      cat.dirX = mx / len;
      cat.dirY = my / len;
      cat.x += cat.dirX * spd;
      cat.y += cat.dirY * spd;
    }


    const z = zones[zoneId];


    // Zone Transitions
    if (cat.x > 745 && z.exits.right && Math.abs(cat.y - 265) < 50) {
      zoneId = z.exits.right; cat.x = 75; populateZone(zoneId);
      setLog(`Entered ${zones[zoneId].name}`);
    } else if (cat.x < 55 && z.exits.left && Math.abs(cat.y - 265) < 50) {
      zoneId = z.exits.left; cat.x = 725; populateZone(zoneId);
      setLog(`Entered ${zones[zoneId].name}`);
    } else if (cat.y < 75 && z.exits.top && Math.abs(cat.x - 400) < 60) {
      zoneId = z.exits.top; cat.y = 435; populateZone(zoneId);
      setLog(`Entered ${zones[zoneId].name}`);
    } else if (cat.y > 455 && z.exits.bottom && Math.abs(cat.x - 400) < 60) {
      zoneId = z.exits.bottom; cat.y = 95; populateZone(zoneId);
      setLog(`Entered ${zones[zoneId].name}`);
    }


    cat.x = Math.max(56, Math.min(744, cat.x));
    cat.y = Math.max(76, Math.min(454, cat.y));


    // Tree Collision Push-out
    for (let t of z.trees) {
      const dist = Math.hypot(cat.x - t.x, cat.y - t.y);
      if (dist < cat.r + t.r && dist > 0) {
        const push = (cat.r + t.r - dist);
        cat.x += ((cat.x - t.x) / dist) * push;
        cat.y += ((cat.y - t.y) / dist) * push;
      }
    }


    // Prey AI (Flees if cat gets close!)
    for (let p of z.prey) {
      const dCat = Math.hypot(p.x - cat.x, p.y - cat.y);
      if (dCat < 120 && dCat > 0) {
        p.vx = ((p.x - cat.x) / dCat) * p.speed;
        p.vy = ((p.y - cat.y) / dCat) * p.speed;
      } else {
        p.moveTimer--;
        if (p.moveTimer <= 0) {
          p.vx = (Math.random() - 0.5) * p.speed;
          p.vy = (Math.random() - 0.5) * p.speed;
          p.moveTimer = 35 + Math.random() * 40;
        }
      }
      p.x = Math.max(75, Math.min(725, p.x + p.vx));
      p.y = Math.max(95, Math.min(435, p.y + p.vy));
    }


    // Rival Warrior & Badger AI
    for (let en of z.enemies) {
      if (en.hitFlash > 0) en.hitFlash--;
      const dx = cat.x - en.x;
      const dy = cat.y - en.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 280 && dist > 1) {
        en.x += (dx / dist) * en.speed;
        en.y += (dy / dist) * en.speed;
      }
      if (dist < cat.r + en.r && cat.invuln <= 0) {
        cat.hp -= en.dmg;
        cat.invuln = 35;
        addEffects(cat.x, cat.y, '#ff007f', 12);
        if (cat.hp <= 0) {
          cat.hp = 0;
          cat.dead = true;
        }
      }
    }
  }


  function drawCatSprite(x, y, dirX, dirY, bodyColor, eyeColor, scale, isHit) {
    ctx.save();
    ctx.translate(x, y);
    const ang = Math.atan2(dirY, dirX);
    ctx.rotate(ang);
    ctx.scale(scale, scale);


    ctx.fillStyle = isHit ? '#ffffff' : bodyColor;
    ctx.shadowBlur = 10;
    ctx.shadowColor = bodyColor;


    // Tail
    ctx.strokeStyle = isHit ? '#ffffff' : bodyColor;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.quadraticCurveTo(-24, -8, -28, 3);
    ctx.stroke();


    // Body & Head
    ctx.beginPath();
    ctx.ellipse(-2, 0, 13, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(10, 0, 8, 0, Math.PI * 2);
    ctx.fill();


    // Pointed Cat Ears
    ctx.beginPath();
    ctx.moveTo(8, -7); ctx.lineTo(15, -11); ctx.lineTo(14, -4);
    ctx.moveTo(8, 7); ctx.lineTo(15, 11); ctx.lineTo(14, 4);
    ctx.fill();


    // Glowing Eyes
    ctx.shadowBlur = 0;
    ctx.fillStyle = eyeColor;
    ctx.fillRect(13, -4, 3, 2);
    ctx.fillRect(13, 2, 3, 2);
    ctx.restore();
  }


  function loop() {
    updateWorld();
    const z = zones[zoneId];


    ctx.fillStyle = '#07080f';
    ctx.fillRect(0, 0, 800, 500);


    // Territory Ground
    ctx.fillStyle = z.bg;
    ctx.fillRect(40, 60, 720, 410);
    ctx.strokeStyle = z.border;
    ctx.lineWidth = 3;
    ctx.strokeRect(40, 60, 720, 410);


    // River Water Feature in River Gorge
    if (zoneId === 'river') {
      ctx.fillStyle = 'rgba(0, 243, 255, 0.16)';
      ctx.fillRect(40, 60, 720, 65);
    }


    // Territory Exits
    ctx.fillStyle = '#ffbe0b';
    if (z.exits.right) ctx.fillRect(756, 220, 8, 90);
    if (z.exits.left) ctx.fillRect(36, 220, 8, 90);
    if (z.exits.top) ctx.fillRect(350, 56, 100, 8);
    if (z.exits.bottom) ctx.fillRect(350, 466, 100, 8);


    // Draw Trees
    z.trees.forEach(t => {
      ctx.fillStyle = '#132a1c';
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });


    // Draw Herbs
    z.herbs.forEach(h => {
      ctx.fillStyle = '#00f3ff';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00f3ff';
      ctx.beginPath();
      ctx.arc(h.x, h.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });


    // Draw Camp NPCs & Fresh-Kill Pile
    z.npcs.forEach(npc => {
      if (npc.type === 'leader' || npc.type === 'med') {
        drawCatSprite(npc.x, npc.y, 0, 1, npc.color, '#ffffff', 1.05, false);
      } else {
        ctx.fillStyle = npc.color;
        ctx.beginPath();
        ctx.arc(npc.x, npc.y, 16, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(npc.hint, npc.x, npc.y - 22);
      ctx.textAlign = 'left';
    });


    // Draw Prey
    z.prey.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });


    // Draw Rival Warriors & Badger
    z.enemies.forEach(en => {
      if (en.isBoss) {
        ctx.fillStyle = en.hitFlash > 0 ? '#fff' : '#ff007f';
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#ff007f';
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        const ang = Math.atan2(cat.y - en.y, cat.x - en.x);
        drawCatSprite(en.x, en.y, Math.cos(ang), Math.sin(ang), en.color, '#ff007f', 1.05, en.hitFlash > 0);
      }
      const bw = en.isBoss ? 84 : 36;
      ctx.fillStyle = '#222';
      ctx.fillRect(en.x - bw / 2, en.y - en.r - 14, bw, 5);
      ctx.fillStyle = en.color;
      ctx.fillRect(en.x - bw / 2, en.y - en.r - 14, bw * (en.hp / en.maxHp), 5);
    });


    // Draw Player Cat
    if (!cat.dead) {
      ctx.save();
      if (cat.invuln > 0 && Math.floor(cat.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.45;
      drawCatSprite(cat.x, cat.y, cat.dirX, cat.dirY, '#ff8822', '#00ff88', 1.1, false);
      ctx.restore();


      // Claw Slash Arc
      if (cat.attackTimer > 0) {
        const ang = Math.atan2(cat.dirY, cat.dirX);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cat.x, cat.y, 34, ang - 0.85, ang + 0.85);
        ctx.stroke();
      }
    }


    // Draw Effects
    for (let i = effects.length - 1; i >= 0; i--) {
      let ef = effects[i];
      ef.x += ef.vx; ef.y += ef.vy; ef.life -= 0.06;
      if (ef.life <= 0) { effects.splice(i, 1); continue; }
      ctx.fillStyle = ef.color;
      ctx.globalAlpha = ef.life;
      ctx.fillRect(ef.x - 2, ef.y - 2, 4, 4);
      ctx.globalAlpha = 1;
    }


    // Top HUD (Syncs REP directly to Leaderboard!)
    ctx.fillStyle = '#1e233a';
    ctx.fillRect(40, 16, 150, 18);
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(40, 16, 150 * (cat.hp / cat.maxHp), 18);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(40, 16, 150, 18);


    ctx.fillStyle = '#ffbe0b';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`${getFullName()} (${RANKS[cat.rankIdx].name})`, 202, 30);


    ctx.fillStyle = '#00f3ff';
    ctx.fillText(`SCORE: ${cat.rep}`, 435, 30);


    ctx.fillStyle = '#fff';
    ctx.fillText(`PREY: ${cat.preyCarried}/5`, 545, 30);


    ctx.textAlign = 'right';
    ctx.fillStyle = z.border;
    ctx.fillText(z.name, 760, 30);
    ctx.textAlign = 'left';


    // Story / Action Log Banner
    if (logTimer > 0) {
      ctx.fillStyle = 'rgba(10, 14, 24, 0.88)';
      ctx.fillRect(110, 428, 580, 28);
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(logText, 400, 446);
      ctx.textAlign = 'left';
    }


    // Defeat Overlay
    if (cat.dead) {
      ctx.fillStyle = 'rgba(7, 8, 15, 0.86)';
      ctx.fillRect(0, 0, 800, 500);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 44px sans-serif';
      ctx.fillText('WALKED WITH STARCLAN', 400, 220);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText(`FINAL RANK: ${getFullName()} | REP: ${cat.rep}`, 400, 265);
      ctx.fillStyle = '#00f3ff';
      ctx.font = '16px sans-serif';
      ctx.fillText('Click "Restart" above to begin a new life', 400, 305);
      ctx.textAlign = 'left';
    }


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
  };
}

// Upgrade Warrior Cats RPG with an interactive Cat Customizer before starting!
const _baseWarriorStart = startWarriorCatsRPG;
startWarriorCatsRPG = function() {
  const PREFIXES = new Array('Flame', 'Shadow', 'Frost', 'Tiger', 'Night', 'Briar', 'Storm', 'Swift');
  const FURS = new Array(
    { name: 'Ginger', hex: '#ff8822' },
    { name: 'Midnight', hex: '#2b2d42' },
    { name: 'Ice White', hex: '#f0f4ff' },
    { name: 'Silver', hex: '#9aa5b1' },
    { name: 'Golden', hex: '#ffbe0b' },
    { name: 'Russet', hex: '#b54428' }
  );
  const EYES = new Array(
    { name: 'Emerald', hex: '#00ff88' },
    { name: 'Amber', hex: '#ffbe0b' },
    { name: 'Ice Blue', hex: '#00f3ff' },
    { name: 'Violet', hex: '#b5179e' }
  );


  // Load previously saved cat appearance if this account made one
  const uData = getUserData();
  let selPrefix = (uData.warriorCat && uData.warriorCat.prefixIdx) || 0;
  let selFur = (uData.warriorCat && uData.warriorCat.furIdx) || 0;
  let selEye = (uData.warriorCat && uData.warriorCat.eyeIdx) || 0;
  let activeCleanup = null;
  let buttons = new Array();


  function saveCatChoice() {
    if (!window.currentUser) return;
    const db = getAccountsDB();
    if (db[window.currentUser]) {
      db[window.currentUser].warriorCat = { prefixIdx: selPrefix, furIdx: selFur, eyeIdx: selEye };
      saveAccountsDB(db);
    }
  }


  function drawCreatorBtn(x, y, w, h, bg, text, textColor, action) {
    buttons.push({ x, y, w, h, action });
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.fillStyle = textColor;
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }


  function drawPreviewCat(x, y, furHex, eyeHex) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(2.6, 2.6);
    ctx.fillStyle = furHex;
    ctx.strokeStyle = furHex;
    ctx.shadowBlur = 14;
    ctx.shadowColor = furHex;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.quadraticCurveTo(-24, -10, -28, 3);
    ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-2, 0, 13, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, -7); ctx.lineTo(15, -11); ctx.lineTo(14, -4);
    ctx.moveTo(8, 7); ctx.lineTo(15, 11); ctx.lineTo(14, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = eyeHex;
    ctx.fillRect(13, -4, 3, 2);
    ctx.fillRect(13, 2, 3, 2);
    ctx.restore();
  }


  const onCreatorClick = e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    for (let b of buttons) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        b.action();
        return;
      }
    }
  };
  canvas.addEventListener('click', onCreatorClick);


  function creatorLoop() {
    buttons = new Array();
    ctx.fillStyle = '#080a14';
    ctx.fillRect(0, 0, 800, 500);


    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ff88';
    ctx.font = '900 30px sans-serif';
    ctx.fillText('CREATE YOUR CLAN WARRIOR', 400, 52);


    ctx.fillStyle = '#8a94b8';
    ctx.font = '15px sans-serif';
    ctx.fillText('Customize your cat before entering Thunder Camp', 400, 80);


    // Live Cat Preview Box
    ctx.fillStyle = '#101322';
    ctx.beginPath();
    ctx.roundRect(260, 105, 280, 140, 14);
    ctx.fill();
    ctx.strokeStyle = FURS[selFur].hex;
    ctx.lineWidth = 2;
    ctx.stroke();


    drawPreviewCat(400, 165, FURS[selFur].hex, EYES[selEye].hex);


    ctx.fillStyle = '#ffbe0b';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(`${PREFIXES[selPrefix]}kit`, 400, 226);
    ctx.textAlign = 'left';


    // Selector Controls
    drawCreatorBtn(150, 270, 150, 40, '#1b223c', `◀ Prefix: ${PREFIXES[selPrefix]} ▶`, '#00f3ff', () => {
      selPrefix = (selPrefix + 1) % PREFIXES.length;
    });


    drawCreatorBtn(325, 270, 150, 40, '#1b223c', `◀ Fur: ${FURS[selFur].name} ▶`, FURS[selFur].hex, () => {
      selFur = (selFur + 1) % FURS.length;
    });


    drawCreatorBtn(500, 270, 150, 40, '#1b223c', `◀ Eyes: ${EYES[selEye].name} ▶`, EYES[selEye].hex, () => {
      selEye = (selEye + 1) % EYES.length;
    });


    // Enter Forest Button
    drawCreatorBtn(270, 355, 260, 52, '#00ff88', '🐾 ENTER THUNDER CAMP ▶', '#000', () => {
      canvas.removeEventListener('click', onCreatorClick);
      cancelAnimationFrame(animFrameId);
      saveCatChoice();
      window._customWarriorChoice = {
        prefix: PREFIXES[selPrefix],
        fur: FURS[selFur].hex,
        eye: EYES[selEye].hex
      };
      activeCleanup = _baseWarriorStart();
    });


    animFrameId = requestAnimationFrame(creatorLoop);
  }
  creatorLoop();


  return () => {
    canvas.removeEventListener('click', onCreatorClick);
    if (activeCleanup) activeCleanup();
  };
};

    130.81, 0, 155.56, 0,      196.00, 174.61, 155.56, 146.83 // C3 -> Eb3 -> G3 run
  );


  const LEAD_NOTES = new Array(
    523.25, 0, 622.25, 0, 783.99, 622.25, 523.25, 0,
    698.46, 0, 783.99, 0, 932.33, 783.99, 698.46, 622.25,
    415.30, 0, 523.25, 0, 622.25, 0,      587.33, 0,
    523.25, 0, 392.00, 0, 523.25, 587.33, 622.25, 783.99
  );


  function ensureContext() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }


  function playTone(freq, type, duration, gainVal, slideTo = 0) {
    if (!audioCtx || freq <= 0) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo > 0) {
      osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    }
    gain.gain.setValueAtTime(gainVal, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }


  function playKick() {
    playTone(135, 'sine', 0.14, 0.22, 38);
  }


  function playHat() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.04;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;


    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 7000;


    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.05, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);


    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
  }


  function tick() {
    if (!isPlaying) return;
    const idx = step % 32;


    // 4-on-the-floor electronic kick + offbeat hi-hats
    if (idx % 4 === 0) playKick();
    if (idx % 2 === 1) playHat();


    // Punchy synth bassline
    const bFreq = BASS_NOTES[idx];
    if (bFreq > 0) playTone(bFreq, 'sawtooth', 0.16, 0.075);


    // Bright chiptune/synth lead melody
    const lFreq = LEAD_NOTES[idx];
    if (lFreq > 0) playTone(lFreq, 'square', 0.18, 0.045);


    step++;
  }


  function start() {
    ensureContext();
    if (isPlaying) return;
    isPlaying = true;
    stepTimer = setInterval(tick, 118); // ~128 BPM
    updateBtnUI();
  }


  function stop() {
    isPlaying = false;
    if (stepTimer) clearInterval(stepTimer);
    stepTimer = null;
    updateBtnUI();
  }


  function toggle() {
    if (isPlaying) stop();
    else start();
  }


  function updateBtnUI() {
    const btn = document.getElementById('btn-toggle-music');
    if (!btn) return;
    if (isPlaying) {
      btn.textContent = '🎵 Music: ON';
      btn.classList.add('playing');
    } else {
      btn.textContent = '🎵 Music: OFF';
      btn.classList.remove('playing');
    }
  }


  return { start, stop, toggle, isPlaying: () => isPlaying };
})();

const GlobalLeaderboard = (function() {
  const GLOBAL_ROOM_ID = 'nexus_arcade_global_lb_v1';

  let isHost = false;

  let clientConns = new Array();


  function getGlobalCache() {
    try {
      return JSON.parse(localStorage.getItem('nexus_global_lb_cache') || '{}');
    } catch (e) {
      return {};

  }


  function saveGlobalCache(cache) {
    try {
      localStorage.setItem('nexus_global_lb_cache', JSON.stringify(cache));
    } catch (e) {}
  }


  // Merge local accounts + received global records (always keeps highest score per player)
  function mergeRecords(incomingMap) {
    const cache = getGlobalCache();
    const localDB = getAccountsDB();


    // First ensure all local accounts are included in cache
    Object.keys(localDB).forEach(u => {
      if (!cache[u]) cache[u] = { highScores: {}, trophies: 0 };
      const localHS = localDB[u].highScores || {};
      Object.keys(localHS).forEach(gid => {
        if ((localHS[gid] || 0) > (cache[u].highScores[gid] || 0)) {
          cache[u].highScores[gid] = localHS[gid];
        }
      });
      const tCount = (localDB[u].achievements || []).length;
      if (tCount > (cache[u].trophies || 0)) cache[u].trophies = tCount;
    });


    // Merge incoming network records
    if (incomingMap && typeof incomingMap === 'object') {
      Object.keys(incomingMap).forEach(u => {
        if (!cache[u]) cache[u] = { highScores: {}, trophies: 0 };
        const incHS = incomingMap[u].highScores || {};
        Object.keys(incHS).forEach(gid => {
          if ((incHS[gid] || 0) > (cache[u].highScores[gid] || 0)) {
            cache[u].highScores[gid] = incHS[gid];
          }
        });
        if ((incomingMap[u].trophies || 0) > (cache[u].trophies || 0)) {
          cache[u].trophies = incomingMap[u].trophies;
        }
      });
    }


    saveGlobalCache(cache);
    return cache;
  }


  function broadcastSync() {
    const merged = mergeRecords(null);
    const pkt = { type: 'lb_sync', records: merged };
    if (isHost) {
      clientConns.forEach(c => { if (c.open) c.send(pkt); });
    } else if (hostConn && hostConn.open) {

            clientConns.forEach(c => {

            });
          }
        });
      });
    });


    attempt.on('error', err => {
      if (err.type === 'unavailable-id') {

        peer.on('open', () => {
          hostConn = peer.connect(GLOBAL_ROOM_ID);
          hostConn.on('open', () => hostConn.send({ type: 'lb_sync', records: mergeRecords(null) }));
          hostConn.on('data', data => {
            if (data && data.type === 'lb_sync') mergeRecords(data.records);
          });
        });
      }
    });
  }

      mySide = 'both';
      statusMsg = 'Offline Mode: Playing both sides';
    }
  }


  function handleChessNet(data) {
    if (!data) return;
    if (data.type === 'chess_hello') {
      opponentName = data.name || 'Opponent';
      statusMsg = mySide === 'w' ? `${opponentName} joined! White's Turn` : `Connected vs ${opponentName}!`;
    } else if (data.type === 'chess_move') {
      applyMove(data.fr, data.fc, data.tr, data.tc, true);
    }
  }


  document.getElementById('chess-start-online').addEventListener('click', () => {
    startOnlineMatch(document.getElementById('chess-room-code').value);
  });


  document.getElementById('chess-start-solo').addEventListener('click', () => {
    lobbyDiv.style.display = 'none';
    mySide = 'both';
    opponentName = 'Local 2P';
    statusMsg = "Local Match — White's Turn";
  });


  const PIECE_SYMBOLS = {
    K: '♔', Q: '♕', R: '♖', B: '♗', N: '♘', P: '♙',
    k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟'
  };


  const boardX = 60, boardY = 30, sqSize = 55;


  const onBoardClick = e => {
    if (lobbyDiv.style.display !== 'none' || matchOver) return;
    if (mySide !== 'both' && turn !== mySide) return;


    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);


    const col = Math.floor((mx - boardX) / sqSize);
    const row = Math.floor((my - boardY) / sqSize);
    if (!inBounds(row, col)) return;


    // Flip visual row/col if playing as Black
    const r = mySide === 'b' ? 7 - row : row;
    const c = mySide === 'b' ? 7 - col : col;


    // Check if clicked square is a legal destination for selected piece
    if (selected) {
      const valid = legalMoves.find(m => m.r === r && m.c === c);
      if (valid) {
        applyMove(selected.r, selected.c, r, c, false);
        return;
      }
    }


    // Select own piece
    const clickedPiece = board[r][c];
    if (clickedPiece !== '' && sideOf(clickedPiece) === turn) {
      selected = { r, c };
      legalMoves = getMovesFor(r, c);
    } else {
      selected = null;
      legalMoves = new Array();
    }
  };
  canvas.addEventListener('click', onBoardClick);


  function loop() {
    ctx.fillStyle = '#07080f';
    ctx.fillRect(0, 0, 800, 500);


    // Draw 8x8 Neon Chessboard
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(boardX - 3, boardY - 3, sqSize * 8 + 6, sqSize * 8 + 6);


    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const r = mySide === 'b' ? 7 - row : row;
        const c = mySide === 'b' ? 7 - col : col;
        const x = boardX + col * sqSize;
        const y = boardY + row * sqSize;


        const isDark = (r + c) % 2 === 1;
        ctx.fillStyle = isDark ? '#14192e' : '#222b4a';
        ctx.fillRect(x, y, sqSize, sqSize);


        // Selected highlight
        if (selected && selected.r === r && selected.c === c) {
          ctx.fillStyle = 'rgba(0, 243, 255, 0.35)';
          ctx.fillRect(x, y, sqSize, sqSize);
        }


        // Legal move dot / capture ring
        if (legalMoves.some(m => m.r === r && m.c === c)) {
          ctx.fillStyle = board[r][c] !== '' ? 'rgba(255, 0, 127, 0.45)' : 'rgba(0, 255, 136, 0.45)';
          ctx.beginPath();
          ctx.arc(x + sqSize / 2, y + sqSize / 2, board[r][c] !== '' ? 22 : 10, 0, Math.PI * 2);
          ctx.fill();
        }


        // Draw Piece
        const p = board[r][c];
        if (p !== '') {
          const whitePiece = isWhite(p);
          ctx.font = '38px serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowBlur = 10;
          ctx.shadowColor = whitePiece ? '#00f3ff' : '#ff007f';
          ctx.fillStyle = whitePiece ? '#e8fbff' : '#ff4da6';
          ctx.fillText(PIECE_SYMBOLS[p], x + sqSize / 2, y + sqSize / 2 + 2);
          ctx.shadowBlur = 0;
        }
      }
    }


    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';


    // Right-Side Match Status Panel
    const px = 530;
    ctx.fillStyle = '#101322';
    ctx.beginPath();
    ctx.roundRect(px, 30, 240, 440, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();


    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('CYBER CHESS', px + 18, 62);


    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    const sideLabel = mySide === 'w' ? 'WHITE (CYAN)' : mySide === 'b' ? 'BLACK (PINK)' : 'BOTH SIDES';
    ctx.fillText(`YOU: ${sideLabel}`, px + 18, 95);
    ctx.fillStyle = '#ffbe0b';
    ctx.fillText(`VS: ${opponentName}`, px + 18, 118);


    ctx.fillStyle = turn === 'w' ? '#00f3ff' : '#ff007f';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(statusMsg, px + 18, 160);


    // Captured Pieces Display
    ctx.fillStyle = '#8a94b8';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('CAPTURED BY WHITE:', px + 18, 205);
    ctx.fillStyle = '#ff4da6';
    ctx.font = '20px serif';
    ctx.fillText(capturedB.map(p => PIECE_SYMBOLS[p]).join(' '), px + 18, 232);


    ctx.fillStyle = '#8a94b8';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('CAPTURED BY BLACK:', px + 18, 275);
    ctx.fillStyle = '#e8fbff';
    ctx.font = '20px serif';
    ctx.fillText(capturedW.map(p => PIECE_SYMBOLS[p]).join(' '), px + 18, 302);


    // Syncs win points directly to Global Leaderboard!
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 15px monospace';
    ctx.fillText(`SCORE: ${pointsEarned}`, px + 18, 445);


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    canvas.removeEventListener('click', onBoardClick);
    if (localChan) localChan.close();
    if (peer) peer.destroy();
    const ui = document.getElementById('chess-lobby-ui');
    if (ui) ui.remove();
  };
}

      <div id="beam-transfer-box" style="display:none; flex-direction:column; gap:0.8rem;">
        <input id="beam-file-input" type="file" style="

        " />
        <button id="beam-send-btn" style="
          width:100%; padding:0.8rem; border:none; border-radius:8px;
          background:linear-gradient(90deg, #ff007f, #9d4edd); color:#fff;
          font-weight:900; font-size:0.95rem; cursor:pointer;
        ">🚀 BEAM FILE TO PEER</button>
      </div>


      <div id="beam-inbox" style="
        margin-top:1rem; max-height:130px; overflow-y:auto;
        display:flex; flex-direction:column; gap:0.5rem;
      "></div>
    </div>
  `;
  wrapper.appendChild(beamUI);


  let peer = null;
  let conn = null;
  const statusEl = document.getElementById('beam-status');
  const transferBox = document.getElementById('beam-transfer-box');
  const inboxEl = document.getElementById('beam-inbox');
  const MAX_BYTES = 15 * 1024 * 1024; // 15 MB safety limit


  function setBeamStatus(msg, color = '#ffbe0b') {
    statusEl.textContent = msg;
    statusEl.style.color = color;
  }


  function setupDataConn(c) {
    conn = c;
    conn.on('open', () => {
      setBeamStatus('✅ Connected! Ready to send or receive files.', '#00ff88');
      transferBox.style.display = 'flex';
    });


    conn.on('data', data => {
      if (data && data.type === 'file_transfer' && data.fileBuffer) {
        const blob = new Blob([data.fileBuffer], { type: data.mimeType || 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const sizeKB = Math.max(1, Math.round(data.fileSize / 1024));


        const item = document.createElement('div');
        item.style.cssText = `
          display:flex; justify-content:space-between; align-items:center;
          background:#161b30; border:1px solid #00ff88; border-radius:8px;
          padding:0.6rem 0.9rem; font-size:0.85rem;
        `;
        item.innerHTML = `
          <div style="text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px;">
            <strong style="color:#00f3ff;">${data.fileName}</strong>
            <span style="color:#8a94b8;"> (${sizeKB} KB)</span>
          </div>
          <a href="${url}" download="${data.fileName}" style="
            background:#00ff88; color:#000; padding:0.35rem 0.75rem;
            border-radius:6px; font-weight:800; text-decoration:none;
          ">⬇️ Save</a>
        `;
        inboxEl.prepend(item);
        setBeamStatus(`📥 Received "${data.fileName}" from ${data.sender || 'Peer'}!`, '#00ff88');
      }
    });


    conn.on('close', () => {
      setBeamStatus('⚠️ Peer disconnected.', '#ff007f');
    });
  }


  document.getElementById('beam-connect-btn').addEventListener('click', () => {
    const rawCode = document.getElementById('beam-room-input').value;
    const code = rawCode.toLowerCase().replace(/[^a-z0-9]/g, '') || 'beam1';


    if (!window.Peer) {
      setBeamStatus('⚠️ PeerJS requires an internet connection.', '#ff007f');
      return;
    }


    if (peer) peer.destroy();
    setBeamStatus(`Connecting to room "${code}"...`, '#00f3ff');


    const hostId = 'nexus_beam_room_' + code;
    const attempt = new window.Peer(hostId);
    peer = attempt;


    attempt.on('open', () => {
      setBeamStatus(`Hosting room "${code}" — Waiting for other device...`, '#ffbe0b');
      attempt.on('connection', incoming => setupDataConn(incoming));
    });


    attempt.on('error', err => {
      if (err.type === 'unavailable-id') {
        const clientPeer = new window.Peer();
        peer = clientPeer;
        clientPeer.on('open', () => {
          const outConn = clientPeer.connect(hostId, { reliable: true });
          setupDataConn(outConn);
        });
      } else {
        setBeamStatus(`Connection error: ${err.type}`, '#ff007f');
      }
    });
  });


  document.getElementById('beam-send-btn').addEventListener('click', () => {
    const fileInput = document.getElementById('beam-file-input');
    const file = fileInput.files && fileInput.files;
    if (!file) {
      setBeamStatus('⚠️ Pick a file first!', '#ffbe0b');
      return;
    }
    if (!conn || !conn.open) {
      setBeamStatus('⚠️ Not connected to a peer yet!', '#ff007f');
      return;
    }
    if (file.size > MAX_BYTES) {
      setBeamStatus('⚠️ File too large! Max size is 15 MB.', '#ff007f');
      return;
    }


    setBeamStatus(`⏳ Beaming "${file.name}"...`, '#00f3ff');
    const reader = new FileReader();
    reader.onload = () => {
      conn.send({
        type: 'file_transfer',
        sender: window.currentUser || 'Player',
        fileName: file.name,
        fileSize: file.size,
        mimeType: file.type,
        fileBuffer: reader.result
      });
      setBeamStatus(`✅ Sent "${file.name}"!`, '#00ff88');
      fileInput.value = '';
    };
    reader.readAsArrayBuffer(file);
  });


  return () => {
    if (peer) peer.destroy();
    const ui = document.getElementById('nexus-beam-ui');
    if (ui) ui.remove();
  };
}

      <div style="display:flex; gap:8px; align-items:center;">
        <input id="maker-song-name" type="text" maxlength="24" placeholder="My Custom Track Name..." style="flex:1; padding:7px 10px; border-radius:6px; border:1px solid #00f3ff; background:#101322; color:#fff; font-weight:bold; user-select:text;" />
        <select id="maker-wave" style="padding:7px; border-radius:6px; background:#101322; color:#00f3ff; border:1px solid #00f3ff; font-weight:bold;">
          <option value="square">Chiptune Lead</option>
          <option value="sawtooth">Neon Synth</option>
          <option value="triangle">Soft Retro</option>
        </select>
        <button id="maker-preview-btn" style="padding:7px 12px; border:none; border-radius:6px; background:#00f3ff; color:#000; font-weight:900; cursor:pointer;">▶ Test Beat</button>
        <button id="maker-save-btn" style="padding:7px 14px; border:none; border-radius:6px; background:#00ff88; color:#000; font-weight:900; cursor:pointer;">💾 Save Song</button>
      </div>


      <div id="sequencer-grid" style="background:#101322; border:1px solid #2b3354; border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:6px;"></div>


      <div id="maker-msg" style="color:#ffbe0b; font-family:monospace; font-size:0.85rem; text-align:center;">Click grid squares to toggle notes, kicks & hats (Max 10 saved songs)</div>
    </div>
  `;
  wrapper.appendChild(studioUI);


  let audioCtx = null;
  let playTimer = null;
  let activeTrack = BUILT_IN_TRACKS;
  let stepIdx = 0;
  let barHeights = new Array(16).fill(10);


  function ensureAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }


  function triggerNote(freq, waveType, dur = 0.16, vol = 0.08) {
    if (!audioCtx || freq <= 0) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = waveType || 'square';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }


  function triggerDrum(isKick) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    if (isKick) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(36, now + 0.14);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    } else {
      osc.type = 'square';
      osc.frequency.setValueAtTime(1200 + Math.random() * 800, now);
      g.gain.setValueAtTime(0.03, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    }
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + (isKick ? 0.14 : 0.04));
  }


  function stopPlayback() {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
    document.getElementById('now-playing-label').textContent = 'STOPPED';
  }


  function startPlayback(track) {
    ensureAudio();
    stopPlayback();
    activeTrack = track;
    stepIdx = 0;
    document.getElementById('now-playing-label').textContent = `▶ ${track.name}`;
    const stepMs = Math.round((60 / (track.bpm || 124) / 4) * 1000);


    playTimer = setInterval(() => {
      const i = stepIdx % 16;
      const noteFreq = track.notes[i] || 0;
      const hasKick = track.kicks[i] === 1;
      const hasHat = track.hats[i] === 1;


      if (noteFreq > 0) {
        triggerNote(noteFreq, track.wave, 0.18, 0.08);
        barHeights[i] = Math.min(180, Math.round(noteFreq / 4));
      }
      if (hasKick) {
        triggerDrum(true);
        barHeights[(i + 1) % 16] = 150;
      }
      if (hasHat) {
        triggerDrum(false);
        barHeights[(i + 2) % 16] = 95;
      }
      stepIdx++;
    }, stepMs);
  }


  function renderTrackLists() {
    const bList = document.getElementById('builtin-list');
    const cList = document.getElementById('custom-list');
    const customs = getCustomTracks();
    document.getElementById('custom-count').textContent = customs.length;


    bList.innerHTML = '';
    BUILT_IN_TRACKS.forEach(tr => {
      const btn = document.createElement('button');
      btn.style.cssText = `
        text-align:left; padding:8px 12px; border-radius:8px; border:1px solid #2b3354;
        background:#101322; color:#fff; font-weight:700; cursor:pointer; font-size:0.85rem;
      `;
      btn.textContent = `🎵 ${tr.name} (${tr.bpm} BPM)`;
      btn.onclick = () => startPlayback(tr);
      bList.appendChild(btn);
    });


    cList.innerHTML = '';
    if (customs.length === 0) {
      cList.innerHTML = `<div style="color:#8a94b8; font-size:0.82rem; padding:6px;">No custom songs saved yet. Use Beat Maker!</div>`;
    } else {
      customs.forEach((tr, idx) => {
        const row = document.createElement('div');
        row.style.cssText = `display:flex; gap:6px; align-items:center;`;
        row.innerHTML = `
          <button class="play-custom-btn" style="flex:1; text-align:left; padding:8px 12px; border-radius:8px; border:1px solid #ffbe0b66; background:#161b30; color:#ffbe0b; font-weight:700; cursor:pointer; font-size:0.85rem;">🎹 ${idx + 1}. ${tr.name}</button>
          <button class="del-custom-btn" style="padding:8px 10px; border-radius:8px; border:none; background:#ff007f; color:#fff; font-weight:900; cursor:pointer;">✕</button>
        `;
        row.querySelector('.play-custom-btn').onclick = () => startPlayback(tr);
        row.querySelector('.del-custom-btn').onclick = () => {
          const updated = getCustomTracks();
          updated.splice(idx, 1);
          saveCustomTracks(updated);
          renderTrackLists();
        };
        cList.appendChild(row);
      });
    }
  }
  renderTrackLists();


  document.getElementById('btn-music-play').onclick = () => startPlayback(activeTrack);
  document.getElementById('btn-music-stop').onclick = stopPlayback;


  // Live Frequency Visualizer Loop
  const vizCanvas = document.getElementById('vizCanvas');
  const vCtx = vizCanvas.getContext('2d');
  const vizColors = new Array('#00f3ff', '#00ff88', '#ff007f', '#ffbe0b', '#9d4edd');


  function vizLoop() {
    vCtx.fillStyle = '#07080f';
    vCtx.fillRect(0, 0, 240, 220);


    for (let i = 0; i < 16; i++) {
      barHeights[i] = Math.max(8, barHeights[i] * 0.88);
      const h = barHeights[i];
      vCtx.fillStyle = vizColors[i % vizColors.length];
      vCtx.fillRect(8 + i * 14, 210 - h, 10, h);
    }
    animFrameId = requestAnimationFrame(vizLoop);
  }
  vizLoop();


  // 16-Step Custom Song Sequencer State (6 rows x 16 steps)
  const ROW_DEFS = new Array(
    { label: 'High C5', freq: 523.25, color: '#00f3ff', type: 'note' },
    { label: 'Note G4', freq: 392.00, color: '#00ff88', type: 'note' },
    { label: 'Note E4', freq: 329.63, color: '#ffbe0b', type: 'note' },
    { label: 'Low C4',  freq: 261.63, color: '#9d4edd', type: 'note' },
    { label: 'Hi-Hat',  freq: 1,      color: '#d8a7ff', type: 'hat' },
    { label: 'Bass Kick',freq: 1,     color: '#ff007f', type: 'kick' }
  );


  let gridState = Array.from({ length: 6 }, () => Array(16).fill(0));
  // Pre-fill a starter pattern so users can test immediately
  gridState = 1; gridState[4] = 1; gridState[8] = 1; gridState[12] = 1;
  gridState[2] = 1; gridState[6] = 1; gridState[10] = 1; gridState[14] = 1;
  gridState = 1; gridState[4] = 1; gridState[8] = 1; gridState[12] = 1;


  function renderSequencer() {
    const container = document.getElementById('sequencer-grid');
    container.innerHTML = '';


    ROW_DEFS.forEach((rDef, rIdx) => {
      const rowEl = document.createElement('div');
      rowEl.style.cssText = 'display:flex; align-items:center; gap:4px;';


      const lbl = document.createElement('div');
      lbl.style.cssText = `width:76px; font-size:0.75rem; font-weight:800; color:${rDef.color}; font-family:monospace;`;
      lbl.textContent = rDef.label;
      rowEl.appendChild(lbl);


      for (let c = 0; c < 16; c++) {
        const cell = document.createElement('button');
        const active = gridState[rIdx][c] === 1;
        cell.style.cssText = `
          flex:1; height:32px; border-radius:4px; border:1px solid ${c % 4 === 0 ? '#4a5580' : '#232942'};
          background:${active ? rDef.color : '#07080f'}; cursor:pointer;
        `;
        cell.onclick = () => {
          if (rDef.type === 'note' && !active) {
            // Only 1 melody note per step column
            for (let mr = 0; mr < 4; mr++) gridState[mr][c] = 0;
          }
          gridState[rIdx][c] = active ? 0 : 1;
          renderSequencer();
        };
        rowEl.appendChild(cell);
      }
      container.appendChild(rowEl);
    });
  }
  renderSequencer();


  function buildTrackFromGrid(title) {
    const notes = Array(16).fill(0);
    const hats = Array(16).fill(0);
    const kicks = Array(16).fill(0);


    for (let c = 0; c < 16; c++) {
      for (let r = 0; r < 4; r++) {
        if (gridState[r][c] === 1) notes[c] = ROW_DEFS[r].freq;
      }
      if (gridState[c] === 1) hats[c] = 1;
      if (gridState[c] === 1) kicks[c] = 1;
    }


    return {
      name: title || 'Custom Beat',
      bpm: 128,
      wave: document.getElementById('maker-wave').value || 'square',
      notes,
      hats,
      kicks
    };
  }


  document.getElementById('maker-preview-btn').onclick = () => {
    const temp = buildTrackFromGrid('Preview Track');
    startPlayback(temp);
  };


  document.getElementById('maker-save-btn').onclick = () => {
    const msgEl = document.getElementById('maker-msg');
    const customs = getCustomTracks();
    if (customs.length >= 10) {
      msgEl.textContent = '⚠️ Limit reached (10/10 custom songs)! Delete one in Stream Player first.';
      return;
    }
    const rawTitle = document.getElementById('maker-song-name').value.trim();
    const title = rawTitle || `Custom Track #${customs.length + 1}`;
    const newSong = buildTrackFromGrid(title);
    customs.push(newSong);
    saveCustomTracks(customs);
    document.getElementById('maker-song-name').value = '';
    msgEl.textContent = `✅ Saved "${title}" (${customs.length}/10 slots used)!`;
    renderTrackLists();
  };


  // Tab Switching (Stream Player <-> Beat Maker)
  const tabPlayer = document.getElementById('tab-player-btn');
  const tabMaker = document.getElementById('tab-maker-btn');
  const viewPlayer = document.getElementById('view-player');
  const viewMaker = document.getElementById('view-maker');


  tabPlayer.onclick = () => {
    viewPlayer.style.display = 'flex';
    viewMaker.style.display = 'none';
    tabPlayer.style.background = '#00f3ff'; tabPlayer.style.color = '#000';
    tabMaker.style.background = 'rgba(255,0,127,0.15)'; tabMaker.style.color = '#ff007f';
    renderTrackLists();
  };


  tabMaker.onclick = () => {
    viewPlayer.style.display = 'none';
    viewMaker.style.display = 'flex';
    tabMaker.style.background = '#ff007f'; tabMaker.style.color = '#fff';
    tabPlayer.style.background = 'rgba(0,243,255,0.15)'; tabPlayer.style.color = '#00f3ff';
  };


  return () => {
    stopPlayback();
    const ui = document.getElementById('nexus-music-ui');
    if (ui) ui.remove();
  };
}

function launchCleanFileBeam() {
  // Wipe any leftover overlays inside canvas-wrapper
  const wrapper = document.querySelector('.canvas-wrapper');
  wrapper.querySelectorAll('div').forEach(d => d.remove());


  const beamUI = document.createElement('div');
  beamUI.id = 'clean-beam-ui';
  beamUI.style.cssText = `
    position: absolute; inset: 0; background: #080a14;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1.5rem; z-index: 50; color: #fff; font-family: sans-serif;
  `;
  beamUI.innerHTML = `
    <div style="
      background: #101322; border: 2px solid #00f3ff; border-radius: 16px;
      padding: 1.6rem; width: 100%; max-width: 480px; text-align: center;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.25);
    ">
      <h3 style="color:#00f3ff; font-weight:900; font-size:1.4rem; margin-bottom:0.3rem;">📡 NEXUS BEAM // P2P TRANSFER</h3>
      <p style="color:#8a94b8; font-size:0.85rem; margin-bottom:1.1rem;">Direct browser-to-browser file sharing (Max 25 MB).</p>


      <div style="display:flex; gap:0.6rem; margin-bottom:1rem;">
        <input id="cbeam-room" type="text" value="beam1" placeholder="Room Code" style="
          flex:1; padding:0.7rem; border-radius:8px; border:1px solid #00f3ff;
          background:#07080f; color:#fff; font-weight:bold; text-align:center; user-select:text;
        " />
        <button id="cbeam-connect" style="
          padding:0.7rem 1.2rem; border:none; border-radius:8px;
          background:linear-gradient(90deg, #00f3ff, #00ff88); color:#000;
          font-weight:900; cursor:pointer;
        ">CONNECT</button>
      </div>


      <div id="cbeam-status" style="
        padding:0.6rem; border-radius:8px; background:#07080f; border:1px solid #2b3354;
        color:#ffbe0b; font-family:monospace; font-size:0.85rem; margin-bottom:1rem;
      ">Status: Enter a room code and click Connect</div>


      <div id="cbeam-controls" style="display:none; flex-direction:column; gap:0.8rem;">
        <input id="cbeam-file" type="file" style="
          padding:0.6rem; background:#07080f; border:1px dashed #00ff88;
          border-radius:8px; color:#f0f4ff; width:100%; cursor:pointer;
        " />
        <button id="cbeam-send" style="
          width:100%; padding:0.8rem; border:none; border-radius:8px;
          background:linear-gradient(90deg, #ff007f, #9d4edd); color:#fff;
          font-weight:900; font-size:0.95rem; cursor:pointer;
        ">🚀 BEAM FILE TO PEER</button>
      </div>


      <div id="cbeam-inbox" style="
        margin-top:1rem; max-height:130px; overflow-y:auto;
        display:flex; flex-direction:column; gap:0.5rem;
      "></div>
    </div>
  `;
  wrapper.appendChild(beamUI);


  let peer = null;
  let conn = null;
  let localChan = null;
  const statusEl = document.getElementById('cbeam-status');
  const controlsEl = document.getElementById('cbeam-controls');
  const inboxEl = document.getElementById('cbeam-inbox');
  const myBeamId = 'beam_' + Math.random().toString(36).slice(2, 8);


  function setStatus(msg, col = '#ffbe0b') {
    statusEl.textContent = msg;
    statusEl.style.color = col;
  }


  function showIncomingFile(data) {
    const blob = new Blob(new Array(data.fileBuffer), { type: data.mimeType || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const sizeKB = Math.max(1, Math.round(data.fileSize / 1024));


    const item = document.createElement('div');
    item.style.cssText = `
      display:flex; justify-content:space-between; align-items:center;
      background:#161b30; border:1px solid #00ff88; border-radius:8px;
      padding:0.6rem 0.9rem; font-size:0.85rem;
    `;
    item.innerHTML = `
      <div style="text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px;">
        <strong style="color:#00f3ff;">${data.fileName}</strong>
        <span style="color:#8a94b8;"> (${sizeKB} KB)</span>
      </div>
      <a href="${url}" download="${data.fileName}" style="
        background:#00ff88; color:#000; padding:0.35rem 0.75rem;
        border-radius:6px; font-weight:800; text-decoration:none;
      ">⬇️ Save</a>
    `;
    inboxEl.prepend(item);
    setStatus(`📥 Received "${data.fileName}"!`, '#00ff88');
  }


  function setupPeerConnection(c) {
    conn = c;
    conn.on('open', () => {
      controlsEl.style.display = 'flex';
      setStatus('✅ Connected worldwide! Ready to send or receive files.', '#00ff88');
    });
    conn.on('data', data => {
      if (data && data.type === 'file_transfer' && data.fileBuffer) {
        showIncomingFile(data);
      }
    });
    conn.on('close', () => setStatus('⚠️ Peer disconnected.', '#ff007f'));
  }


  function connectRoom(code) {
    // 1. Always unlock the file picker & local BroadcastChannel immediately
    controlsEl.style.display = 'flex';
    if ('BroadcastChannel' in window) {
      if (localChan) localChan.close();
      localChan = new BroadcastChannel('nexus_cbeam_' + code);
      localChan.onmessage = ev => {
        if (ev.data && ev.data.senderId !== myBeamId && ev.data.type === 'file_transfer') {
          showIncomingFile(ev.data);
        }
      };
    }


    // 2. Connect via PeerJS for cross-device internet transfers
    if (!window.Peer) {
      setStatus('🟡 Local Tab Mode ready (loading worldwide relay...)', '#ffbe0b');
      const s = document.createElement('script');
      s.src = 'https://jsdelivr.net';
      s.onload = () => connectRoom(code);
      s.onerror = () => setStatus('🟡 Local Tab Mode ready (External relay blocked by Wi-Fi)', '#ffbe0b');
      document.head.appendChild(s);
      return;
    }


    if (peer) peer.destroy();
    const hostId = 'nexus_cbeam_room_' + code;
    const p = new window.Peer(hostId);
    peer = p;


    p.on('open', () => {
      setStatus(`🟢 Hosting "${code}" — Waiting for 2nd PC to join...`, '#00f3ff');
      p.on('connection', inc => setupPeerConnection(inc));
    });


    p.on('error', err => {
      if (err.type === 'unavailable-id') {
        const client = new window.Peer();
        peer = client;
        client.on('open', () => {
          setupPeerConnection(client.connect(hostId, { reliable: true }));
        });
      } else {
        setStatus(`🟡 Local Tab Mode ready (PeerJS notice: ${err.type})`, '#ffbe0b');
      }
    });
  }


  document.getElementById('cbeam-connect').onclick = () => {
    const raw = document.getElementById('cbeam-room').value;
    const code = raw.toLowerCase().replace(/[^a-z0-9]/g, '') || 'beam1';
    connectRoom(code);
  };


  document.getElementById('cbeam-send').onclick = () => {
    const fInput = document.getElementById('cbeam-file');
    // Use .item(0) instead of square brackets so nothing ever gets stripped
    const file = fInput.files && fInput.files.item(0);
    if (!file) {
      setStatus('⚠️ Pick a file first!', '#ffbe0b');
      return;
    }
    if (file.size > 25 * 1024 * 1024) {
      setStatus('⚠️ Max file size is 25 MB.', '#ff007f');
      return;
    }


    setStatus(`⏳ Beaming "${file.name}"...`, '#00f3ff');
    const reader = new FileReader();
    reader.onload = () => {
      const payload = {
        type: 'file_transfer',
        senderId: myBeamId,
        fileName: file.name,
        fileSize: file.size,
        mimeType: file.type,
        fileBuffer: reader.result
      };
      if (conn && conn.open) conn.send(payload);
      if (localChan) localChan.postMessage(payload);
      setStatus(`✅ Beamed "${file.name}"!`, '#00ff88');
      fInput.value = '';
    };
    reader.readAsArrayBuffer(file);
  };


  return () => {
    if (localChan) localChan.close();
    if (peer) peer.destroy();
    beamUI.remove();
  };
}

  function playNote(freq, wave, dur = 0.16, vol = 0.08) {
    if (!audioCtx || freq <= 0) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = wave || 'square';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }


  function playHit(isKick) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = isKick ? 'sine' : 'square';
    osc.frequency.setValueAtTime(isKick ? 140 : 1400, now);
    if (isKick) osc.frequency.exponentialRampToValueAtTime(36, now + 0.14);
    g.gain.setValueAtTime(isKick ? 0.22 : 0.03, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + (isKick ? 0.14 : 0.04));
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + (isKick ? 0.14 : 0.04));
  }


  function stopSong() {
    if (timer) clearInterval(timer);

  function startSong(tr) {

      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();

    if (audioCtx.state === 'suspended') audioCtx.resume();
    stopSong();
    currentTrack = tr;
    step = 0;
    const lbl = document.getElementById('cm-now');
    if (lbl) lbl.textContent = `▶ ${tr.name}`;
    const ms = Math.round((60 / (tr.bpm || 124) / 4) * 1000);


    timer = setInterval(() => {
      const i = step % 16;
      const f = tr.notes.at(i) || 0;
      if (f > 0) {
        playNote(f, tr.wave, 0.18, 0.08);
        bars.splice(i, 1, Math.min(180, Math.round(f / 4)));
      }
      if (tr.kicks.at(i) === 1) {
        playHit(true);
        bars.splice((i + 1) % 16, 1, 150);
      }
      if (tr.hats.at(i) === 1) {
        playHit(false);
        bars.splice((i + 2) % 16, 1, 95);
      }
      step++;

  document.getElementById('cm-play').onclick = () => startSong(currentTrack);

  const vCanvas = document.getElementById('cm-viz');
  const vCtx = vCanvas.getContext('2d');
  const vCols = new Array('#00f3ff', '#00ff88', '#ff007f', '#ffbe0b', '#9d4edd');
  function drawViz() {
    vCtx.fillStyle = '#07080f';
    vCtx.fillRect(0, 0, 240, 220);
    for (let i = 0; i < 16; i++) {
      const nextH = Math.max(8, bars.at(i) * 0.88);

      vCtx.fillStyle = vCols.at(i % vCols.length);
      vCtx.fillRect(8 + i * 14, 210 - nextH, 10, nextH);
    }
    animFrameId = requestAnimationFrame(drawViz);
  }
  drawViz();


  const ROWS = new Array(
    { label: 'High C5', freq: 523.25, color: '#00f3ff', kind: 'note' },
    { label: 'Note G4', freq: 392.00, color: '#00ff88', kind: 'note' },
    { label: 'Note E4', freq: 329.63, color: '#ffbe0b', kind: 'note' },

    { label: 'Hi-Hat',  freq: 1,      color: '#d8a7ff', kind: 'hat' },
    { label: 'Bass Kick',freq: 1,     color: '#ff007f', kind: 'kick' }
  );


  const grid = new Array(
    new Array(0,0,1,0, 0,0,1,0, 0,0,1,0, 0,0,1,0),
    new Array(0,1,0,0, 0,1,0,0, 0,1,0,0, 0,1,0,0),
    new Array(0,0,0,1, 0,0,0,1, 0,0,0,1, 0,0,0,1),
    new Array(1,0,0,0, 1,0,0,0, 1,0,0,0, 1,0,0,0),
    new Array(0,0,1,0, 0,0,1,0, 0,0,1,0, 0,0,1,0),
    new Array(1,0,0,0, 1,0,0,0, 1,0,0,0, 1,0,0,0)
  );


  function drawGrid() {
    const gEl = document.getElementById('cm-grid');
    gEl.innerHTML = '';
    ROWS.forEach((rObj, r) => {
      const rowDiv = document.createElement('div');
      rowDiv.style.cssText = 'display:flex; align-items:center; gap:4px;';
      const lbl = document.createElement('div');
      lbl.style.cssText = `width:76px; font-size:0.75rem; font-weight:800; color:${rObj.color}; font-family:monospace;`;
      lbl.textContent = rObj.label;
      rowDiv.appendChild(lbl);


      const rowArr = grid.at(r);
      for (let c = 0; c < 16; c++) {
        const cell = document.createElement('button');
        const on = rowArr.at(c) === 1;
        cell.style.cssText = `flex:1; height:32px; border-radius:4px; border:1px solid ${c % 4 === 0 ? '#4a5580' : '#232942'}; background:${on ? rObj.color : '#07080f'}; cursor:pointer;`;
        cell.onclick = () => {
          if (rObj.kind === 'note' && !on) {
            for (let mr = 0; mr < 4; mr++) grid.at(mr).splice(c, 1, 0);
          }
          rowArr.splice(c, 1, on ? 0 : 1);
          drawGrid();
        };
        rowDiv.appendChild(cell);
      }
      gEl.appendChild(rowDiv);
    });
  }
  drawGrid();


  function compileSong(title) {
    const notes = new Array(16).fill(0);
    const hats = new Array(16).fill(0);
    const kicks = new Array(16).fill(0);
    for (let c = 0; c < 16; c++) {
      for (let r = 0; r < 4; r++) {
        if (grid.at(r).at(c) === 1) notes.splice(c, 1, ROWS.at(r).freq);
      }
      if (grid.at(4).at(c) === 1) hats.splice(c, 1, 1);
      if (grid.at(5).at(c) === 1) kicks.splice(c, 1, 1);
    }
    return { name: title || 'Custom Beat', bpm: 128, wave: document.getElementById('cm-wave').value, notes, hats, kicks };
  }


  document.getElementById('cm-test').onclick = () => startSong(compileSong('Preview Beat'));
  document.getElementById('cm-save').onclick = () => {
    const msg = document.getElementById('cm-msg');
    const list = loadCustomSongs();
    if (list.length >= 10) {
      msg.textContent = '⚠️ Max 10 custom songs reached! Delete one first.';
      return;
    }
    const name = document.getElementById('cm-name').value.trim() || `Custom Beat #${list.length + 1}`;
    list.push(compileSong(name));
    saveCustomSongs(list);
    document.getElementById('cm-name').value = '';
    msg.textContent = `✅ Saved "${name}" (${list.length}/10)!`;
    refreshLists();
  };


  const tPlay = document.getElementById('cm-tab-play');
  const tMake = document.getElementById('cm-tab-make');
  const vPlay = document.getElementById('cm-view-play');
  const vMake = document.getElementById('cm-view-make');


  tPlay.onclick = () => {
    vPlay.style.display = 'flex';
    vMake.style.display = 'none';
    tPlay.style.background = '#00f3ff'; tPlay.style.color = '#000';
    tMake.style.background = 'rgba(255,0,127,0.15)'; tMake.style.color = '#ff007f';
    refreshLists();
  };


  tMake.onclick = () => {
    vPlay.style.display = 'none';
    vMake.style.display = 'flex';
    tMake.style.background = '#ff007f'; tMake.style.color = '#fff';
    tPlay.style.background = 'rgba(0,243,255,0.15)'; tPlay.style.color = '#00f3ff';
  };


  return () => {
    stopSong();
    ui.remove();
  };
}
/* ==========================================================================
   MODULE 24: STICKMAN BOW DUEL — BOSS BATTLES & 5-OPTION LEVEL-UP SYSTEM

startStickmanArcher = function() {
  let dragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragCurrent = { x: 0, y: 0 };


  let player = {
    x: 120, y: 380, hp: 100, maxHp: 100,
    dmgMult: 1, multiShot: 1, explosive: false, lifesteal: 0
  };
  let enemy = { x: 680, y: 320, hp: 100, maxHp: 100, isBoss: false };
  let arrows = new Array();
  let blasts = new Array();
  let turn = 'player'; // 'player' | 'flight' | 'enemy' | 'levelup'
  let wins = 0;
  let level = 1;
  let message = 'Drag mouse to aim & shoot!';
  let upgradeBtns = new Array();


  const UPGRADE_OPTIONS = new Array(
    {
      id: 'triple', title: '🏹 TRIPLE-SHOT VOLLEY',
      desc: 'Fire a 3-arrow spread fan every shot!', color: '#00f3ff',
      apply: () => { player.multiShot = Math.min(5, player.multiShot + 2); }
    },
    {
      id: 'power', title: '⚡ OVERCHARGED BOW',
      desc: '+45% Arrow Damage on all hits!', color: '#ffbe0b',
      apply: () => { player.dmgMult += 0.45; }
    },
    {
      id: 'boom', title: '🔥 EXPLOSIVE ARROWS',
      desc: 'Arrows detonate for +30 bonus blast DMG!', color: '#ff007f',
      apply: () => { player.explosive = true; player.dmgMult += 0.15; }
    },
    {
      id: 'armor', title: '🛡️ TITAN ARMOR + HEAL',
      desc: '+50 Max HP & Full Health Restore!', color: '#00ff88',
      apply: () => { player.maxHp += 50; player.hp = player.maxHp; }
    },
    {
      id: 'vamp', title: '🧛 VAMPIRIC QUIVER',
      desc: 'Heal +25 HP every time you hit an enemy!', color: '#9d4edd',
      apply: () => { player.lifesteal += 25; player.hp = Math.min(player.maxHp, player.hp + 30); }
    }
  );


  function setupNextEnemy() {
    player.y = 280 + Math.random() * 140;
    enemy.y = 220 + Math.random() * 180;
    arrows = new Array();
    // Every 5th enemy (wins = 4, 9, 14...) is a Boss!
    if ((wins + 1) % 5 === 0) {
      enemy.isBoss = true;
      enemy.maxHp = 260 + level * 60;
      enemy.hp = enemy.maxHp;
      message = '⚠️ BOSS WAVE! Defeat the Omega Archer!';
    } else {
      enemy.isBoss = false;
      enemy.maxHp = 100 + Math.floor(wins / 5) * 35;
      enemy.hp = enemy.maxHp;
    }
    turn = 'player';
  }
  setupNextEnemy();


  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  };


  const onDown = e => {
    const pos = getPos(e);
    if (turn === 'levelup') {
      for (let b of upgradeBtns) {
        if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) {
          b.opt.apply();
          level++;
          message = `LEVEL ${level}! Selected ${b.opt.title}!`;
          setupNextEnemy();
          return;
        }
      }
      return;
    }
    if (turn !== 'player') return;
    dragging = true;
    dragStart = pos;
    dragCurrent = pos;
  };


  const onMove = e => {
    if (dragging) dragCurrent = getPos(e);
  };


  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    const dx = dragStart.x - dragCurrent.x;
    const dy = dragStart.y - dragCurrent.y;
    const power = Math.min(22, Math.hypot(dx, dy) * 0.12);
    if (power > 2) {
      const baseAngle = Math.atan2(dy, dx);
      const count = player.multiShot;
      const spread = 0.08;
      for (let i = 0; i < count; i++) {
        const offset = (i - (count - 1) / 2) * spread;
        const ang = baseAngle + offset;
        arrows.push({
          x: player.x + 15,
          y: player.y - 45,
          vx: Math.cos(ang) * power,
          vy: Math.sin(ang) * power,
          owner: 'player'
        });
      }
      turn = 'flight';
    }
  };


  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);


  function enemyShoot() {
    if (turn === 'levelup') return;
    const dx = player.x - enemy.x;
    const dy = (player.y - 40) - (enemy.y - 45);
    const flightTime = 55;
    const shots = enemy.isBoss ? 2 : 1;
    for (let s = 0; s < shots; s++) {
      const vx = (dx / flightTime) + (Math.random() - 0.5) * (enemy.isBoss ? 2.2 : 1.5);
      const vy = (dy - 0.5 * 0.35 * flightTime * flightTime) / flightTime + (s * -1.4) + (Math.random() - 0.5) * 1.2;
      arrows.push({ x: enemy.x - 15, y: enemy.y - 45, vx, vy, owner: 'enemy' });
    }
    turn = 'flight';
  }


  function drawArcherUnit(x, y, color, facingRight, isBoss) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color;
    ctx.shadowBlur = isBoss ? 18 : 10;
    ctx.shadowColor = color;
    ctx.lineWidth = isBoss ? 4.5 : 3.5;


    // Cliff Platform
    ctx.fillStyle = '#181d36';
    ctx.fillRect(-35, 0, 70, 500 - y);
    ctx.strokeRect(-35, 0, 70, 500 - y);


    if (isBoss) ctx.scale(1.3, 1.3);


    // Stickman Body
    ctx.beginPath(); ctx.arc(0, -62, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -52); ctx.lineTo(0, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(-10, 0); ctx.moveTo(0, -24); ctx.lineTo(10, 0); ctx.stroke();


    // Boss Crown
    if (isBoss) {
      ctx.fillStyle = '#ffbe0b';
      ctx.beginPath();
      ctx.moveTo(-9, -74); ctx.lineTo(-5, -83); ctx.lineTo(0, -76);

      ctx.closePath();
      ctx.fill();
    }


    // Bow

  }


  function spawnBlast(x, y, color) {
    for (let i = 0; i < 16; i++) {

        vy: (Math.random() - 0.5) * 9,
        life: 1,

      });
    }
  }


  function loop() {
    ctx.fillStyle = '#080a14';
    ctx.fillRect(0, 0, 800, 500);


    drawArcherUnit(player.x, player.y, '#00f3ff', true, false);
    drawArcherUnit(enemy.x, enemy.y, enemy.isBoss ? '#ffbe0b' : '#ff007f', false, enemy.isBoss);


    // Trajectory Preview
    if (dragging && turn === 'player') {
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const power = Math.min(22, Math.hypot(dx, dy) * 0.12);
      const angle = Math.atan2(dy, dx);
      let vx = Math.cos(angle) * power;
      let vy = Math.sin(angle) * power;
      let px = player.x + 15;
      let py = player.y - 45;


      ctx.fillStyle = '#ffbe0b';
      for (let t = 0; t < 25; t++) {
        px += vx; py += vy; vy += 0.35;
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
      }
    }


    // Update Arrows
    let playerArrowsLeft = 0;
    let enemyArrowsLeft = 0;


    for (let i = arrows.length - 1; i >= 0; i--) {
      let a = arrows.at(i);
      a.x += a.vx;
      a.y += a.vy;
      a.vy += 0.35;


      if (a.owner === 'player') playerArrowsLeft++;
      else enemyArrowsLeft++;


      const ang = Math.atan2(a.vy, a.vx);
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(ang);
      ctx.strokeStyle = a.owner === 'player' ? (player.explosive ? '#ffbe0b' : '#00f3ff') : '#ff007f';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke();
      ctx.restore();


      // Player Arrow hits Enemy / Boss
      const hitHeight = enemy.isBoss ? 95 : 75;
      if (a.owner === 'player' && Math.abs(a.x - enemy.x) < 24 && a.y > enemy.y - hitHeight && a.y < enemy.y) {
        const headshot = a.y < enemy.y - (hitHeight - 25);
        const baseDmg = headshot ? 60 : 35;
        const bonus = player.explosive ? 30 : 0;
        const totalDmg = Math.round(baseDmg * player.dmgMult) + bonus;


        enemy.hp -= totalDmg;
        if (player.lifesteal > 0) {
          player.hp = Math.min(player.maxHp, player.hp + player.lifesteal);
        }
        spawnBlast(a.x, a.y, player.explosive ? '#ffbe0b' : '#00f3ff');
        message = headshot ? `HEADSHOT! -${totalDmg} HP` : `DIRECT HIT! -${totalDmg} HP`;
        arrows.splice(i, 1);


        if (enemy.hp <= 0) {
          const wasBoss = enemy.isBoss;
          wins++;
          arrows = new Array();
          if (wasBoss) {
            turn = 'levelup';
            message = 'BOSS DEFEATED! Choose your Level-Up Upgrade!';
          } else {
            message = `VICTORY! (${wins % 5}/5 to Boss)`;
            setTimeout(setupNextEnemy, 850);
          }
          break;
        }
        continue;
      }


      // Enemy Arrow hits Player
      if (a.owner === 'enemy' && Math.abs(a.x - player.x) < 20 && a.y > player.y - 75 && a.y < player.y) {
        const dmgTaken = enemy.isBoss ? 40 : 30;
        player.hp -= dmgTaken;
        spawnBlast(a.x, a.y, '#ff007f');
        message = `YOU GOT HIT! -${dmgTaken} HP`;
        arrows.splice(i, 1);


        if (player.hp <= 0) {
          wins = 0;
          level = 1;
          player.maxHp = 100;
          player.hp = 100;
          player.dmgMult = 1;
          player.multiShot = 1;
          player.explosive = false;
          player.lifesteal = 0;
          arrows = new Array();
          message = 'DEFEATED! Run reset to Level 1...';
          setTimeout(setupNextEnemy, 1200);
          break;
        }
        continue;
      }


      if (a.y > 510 || a.x < -20 || a.x > 820) {
        arrows.splice(i, 1);
      }
    }


    // Turn transition once all volley arrows finish flying
    if (turn === 'flight' && arrows.length === 0 && enemy.hp > 0 && player.hp > 0) {
      if (playerArrowsLeft > 0) {
        turn = 'enemy';
        setTimeout(enemyShoot, 450);
      } else {
        turn = 'player';
      }
    }


    // Blast Particles
    for (let i = blasts.length - 1; i >= 0; i--) {
      let b = blasts.at(i);
      b.x += b.vx; b.y += b.vy; b.life -= 0.07;
      if (b.life <= 0) { blasts.splice(i, 1); continue; }
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.life;
      ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
      ctx.globalAlpha = 1;
    }


    // Top HUD
    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 17px monospace';
    ctx.fillText(`YOU: ${Math.max(0, player.hp)}/${player.maxHp} HP`, 35, 36);


    ctx.fillStyle = enemy.isBoss ? '#ffbe0b' : '#ff007f';
    ctx.fillText(`${enemy.isBoss ? '👑 BOSS' : 'RIVAL'}: ${Math.max(0, enemy.hp)} HP`, 585, 36);


    ctx.fillStyle = '#00ff88';
    ctx.textAlign = 'center';
    ctx.fillText(`LV.${level} | WIN STREAK: ${wins} (${wins % 5}/5 TO BOSS)`, 400, 36);


    ctx.fillStyle = '#fff';
    ctx.font = '15px sans-serif';
    ctx.fillText(message, 400, 66);
    ctx.textAlign = 'left';


    // 5-Option Level-Up Overlay Screen
    if (turn === 'levelup') {
      upgradeBtns = new Array();
      ctx.fillStyle = 'rgba(5, 6, 12, 0.9)';
      ctx.fillRect(0, 0, 800, 500);


      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffbe0b';
      ctx.font = '900 32px sans-serif';
      ctx.fillText(`⭐ BOSS DEFEATED! LEVEL ${level + 1} UPGRADE ⭐`, 400, 62);


      ctx.fillStyle = '#8a94b8';
      ctx.font = '15px sans-serif';
      ctx.fillText('Click 1 of the 5 power-ups below to continue your run:', 400, 90);


      UPGRADE_OPTIONS.forEach((opt, idx) => {
        const bx = 170, by = 112 + idx * 70, bw = 460, bh = 58;
        upgradeBtns.push({ x: bx, y: by, w: bw, h: bh, opt });


        ctx.fillStyle = '#101322';
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 10);
        ctx.fill();


        ctx.strokeStyle = opt.color;
        ctx.lineWidth = 2;
        ctx.stroke();


        ctx.fillStyle = opt.color;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(opt.title, 400, by + 23);


        ctx.fillStyle = '#f0f4ff';
        ctx.font = '13px sans-serif';
        ctx.fillText(opt.desc, 400, by + 44);
      });
      ctx.textAlign = 'left';
    }


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    canvas.removeEventListener('mousedown', onDown);
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  };
};

  const CATALOG_ROOM = 'nexusblox_global_catalog_v1';
  let peer = null;
  let isHost = false;
  let hostConn = null;
  let clientConns = new Array();


  const FEATURED_GAMES = new Array(
    {
      id: 'feat_laser_dodge',

        { type: 'star', label: 'Spawn Star Goal', color: '#ffbe0b' },
        { type: 'loop3', label: 'Repeat Auto x3', color: '#ff5400' }
      )
    }
  );


  function getCatalog() {
    let saved = new Array();
    try {
      saved = JSON.parse(localStorage.getItem('nexusblox_catalog_cache') || '[]');
    } catch (e) { saved = new Array(); }


    const map = {};
    FEATURED_GAMES.forEach(g => { map[g.id] = { ...g }; });
    saved.forEach(g => {
      if (!map[g.id]) {
        map[g.id] = { ...g };
      } else {
        map[g.id].plays = Math.max(map[g.id].plays || 0, g.plays || 0);
        map[g.id].likes = Math.max(map[g.id].likes || 0, g.likes || 0);
      }
    });
    return Object.values(map);
  }


  function mergeAndSaveCatalog(incomingList) {
    const current = getCatalog();
    const map = {};
    current.forEach(g => { map[g.id] = g; });


    if (Array.isArray(incomingList)) {
      incomingList.forEach(g => {
        if (!g || !g.id || !Array.isArray(g.blocks)) return;
        if (!map[g.id]) {
          map[g.id] = { ...g };
        } else {
          map[g.id].plays = Math.max(map[g.id].plays || 0, g.plays || 0);
          map[g.id].likes = Math.max(map[g.id].likes || 0, g.likes || 0);
        }
      });
    }


    const merged = Object.values(map);
    try {
      localStorage.setItem('nexusblox_catalog_cache', JSON.stringify(merged));
    } catch (e) {}
    return merged;
  }


  function syncCatalog() {
    const pkt = { type: 'nb_sync', games: getCatalog() };
    if (isHost) {
      clientConns.forEach(c => { if (c.open) c.send(pkt); });
    } else if (hostConn && hostConn.open) {
      hostConn.send(pkt);
    }
  }


  function connectCatalogMesh() {
    if (peer || !window.Peer) return;
    const attempt = new window.Peer(CATALOG_ROOM);
    attempt.on('open', () => {
      peer = attempt;
      isHost = true;
      peer.on('connection', conn => {
        clientConns.push(conn);
        conn.on('open', () => conn.send({ type: 'nb_sync', games: getCatalog() }));
        conn.on('data', data => {
          if (data && data.type === 'nb_sync') {
            const updated = mergeAndSaveCatalog(data.games);
            clientConns.forEach(c => { if (c.open) c.send({ type: 'nb_sync', games: updated }); });
          }
        });
      });
    });


    attempt.on('error', err => {
      if (err.type === 'unavailable-id') {
        peer = new window.Peer();
        peer.on('open', () => {
          hostConn = peer.connect(CATALOG_ROOM);
          hostConn.on('open', () => hostConn.send({ type: 'nb_sync', games: getCatalog() }));
          hostConn.on('data', data => {
            if (data && data.type === 'nb_sync') mergeAndSaveCatalog(data.games);
          });
        });
      }
    });
  }


  setTimeout(connectCatalogMesh, 2000);


  return { getCatalog, mergeAndSaveCatalog, syncCatalog };
})();

   MODULE 30: GLOBAL CROSS-DEVICE ACCOUNT SYNC (PEERJS CLOUD VAULT)
