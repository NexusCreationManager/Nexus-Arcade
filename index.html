<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Arcade - Free Public Gaming Hub</title>
  <style>
    :root {
      --bg-dark: #07080f;
      --bg-card: #101322;
      --bg-card-hover: #171c33;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #9d4edd;
      --neon-green: #00ff88;
      --neon-yellow: #ffbe0b;
      --text-main: #f0f4ff;
      --text-muted: #8a94b8;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }


    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(157, 78, 221, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.12) 0%, transparent 40%);
    }


    .bg-grid {
      position: fixed;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      z-index: -1;
      pointer-events: none;
    }


    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 5%;
      background: rgba(7, 8, 15, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }


    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }


    .stats-bar {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }


    .badge {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: 600;
    }


    .hero {
      text-align: center;
      padding: 3.5rem 5% 2rem;
    }


    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 900;
      margin-bottom: 0.8rem;
      letter-spacing: -1px;
    }


    .hero p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 2rem;
      font-size: 1.1rem;
    }


    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
      padding: 0 5%;
    }


    .filter-btn {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s ease;
    }


    .filter-btn:hover, .filter-btn.active {
      background: var(--neon-cyan);
      color: #000;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
    }


    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.8rem;
      padding: 0 5% 5rem;
      max-width: 1400px;
      margin: 0 auto;
    }


    .game-card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }


    .game-card:hover {
      transform: translateY(-8px);
      background: var(--bg-card-hover);
      border-color: var(--neon-cyan);
      box-shadow: 0 12px 30px rgba(0, 243, 255, 0.15);
    }


    .card-thumb {
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }


    .card-thumb svg {
      width: 90px;
      height: 90px;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.4));
      transition: transform 0.3s ease;
    }


    .game-card:hover .card-thumb svg {
      transform: scale(1.12);
    }


    .card-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.7rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid rgba(255,255,255,0.15);
    }


    .card-body {
      padding: 1.4rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }


    .card-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }


    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 1.2rem;
    }


    .play-btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--neon-cyan), #0099ff);
      color: #000;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }


    #game-modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 12, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }


    #game-modal.active {
      display: flex;
    }


    .modal-header {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }


    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--neon-cyan);
    }


    .modal-controls {
      display: flex;
      gap: 0.8rem;
    }


    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }


    .btn-close {
      background: var(--neon-pink);
      color: #fff;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }


    .canvas-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
      border: 2px solid rgba(0, 243, 255, 0.4);
      background: #090b14;
    }


    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }


    .controls-hint {
      margin-top: 0.8rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }


    .key {
      display: inline-block;
      background: #1e233a;
      border: 1px solid #384166;
      padding: 0.15rem 0.5rem;
      border-radius: 5px;
      color: #fff;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>


<body>


  <div class="bg-grid"></div>


  <header>
    <div class="logo" onclick="closeGame()">NEXUS // ARCADE</div>
    <div class="stats-bar">
      <span>6 Built-In Games</span>
      <span class="badge">100% Offline Ready</span>
    </div>
  </header>


  <section class="hero">
    <h1>NEXT-GEN SCHOOL ARCADE</h1>
    <p>Zero downloads. Pure HTML5 Canvas action. Pick a category below and beat the high scores.</p>
  </section>


  <div class="filters">
    <button class="filter-btn active" data-filter="all">All Games (6)</button>
    <button class="filter-btn" data-filter="car">Car & Racing</button>
    <button class="filter-btn" data-filter="stickman">Stickman Battles</button>
    <button class="filter-btn" data-filter="puzzle">Puzzle & Brain</button>
    <button class="filter-btn" data-filter="arcade">Classic Arcade</button>
  </div>


  <main class="game-grid" id="game-grid"></main>


  <div id="game-modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-game-title">Game Title</div>
      <div class="modal-controls">
        <button class="btn-secondary" onclick="restartCurrentGame()">↻ Restart</button>
        <button class="btn-close" onclick="closeGame()">✕ Exit to Hub</button>
      </div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>
    <div class="controls-hint" id="controls-hint"></div>
  </div>


<script>
const GAMES = [
  {
    id: 'neon-drift',
    title: 'Neon Drift: Highway',
    category: 'car',
    tag: 'Car Racing',
    desc: 'Weave through cyber traffic at 200 MPH. Hold Nitro for extreme speed and multiplier points.',
    controls: '<span class="key">A</span> / <span class="key">D</span> or <span class="key">◀</span> <span class="key">▶</span> Steer &nbsp;|&nbsp; <span class="key">SPACE</span> or <span class="key">W</span> Nitro Boost',
    gradient: 'linear-gradient(135deg, #00f3ff33, #0051ff33)',
    icon: `<svg viewBox="0 0 64 64" fill="none" stroke="#00f3ff" stroke-width="3"><rect x="16" y="8" width="32" height="48" rx="8"/><path d="M16 20h32M16 44h32M22 8v-4M42 8v-4M22 60v-4M42 60v-4"/></svg>`
  },
  {
    id: 'stickman-brawl',
    title: 'Stickman Arena Brawl',
    category: 'stickman',
    tag: 'Stickman Battle',
    desc: 'Survive endless waves of shadow stickmen! Unleash punches, flying kicks, and shockwaves.',
    controls: '<span class="key">A</span> <span class="key">D</span> Move &nbsp;|&nbsp; <span class="key">W</span> Jump &nbsp;|&nbsp; <span class="key">J</span> / <span class="key">Z</span> Punch &nbsp;|&nbsp; <span class="key">K</span> / <span class="key">X</span> Power Kick',
    gradient: 'linear-gradient(135deg, #ff007f33, #9d4edd33)',
    icon: `<svg viewBox="0 0 64 64" fill="none" stroke="#ff007f" stroke-width="3.5" stroke-linecap="round"><circle cx="32" cy="14" r="7"/><path d="M32 21v18M32 26l-12 8M32 26l14-6M32 39l-10 17M32 39l12 17"/></svg>`
  },
  {
    id: 'stickman-archer',
    title: 'Stickman Bow Duel',
    category: 'stickman',
    tag: 'Stickman Battle',
    desc: 'Calculate wind and gravity to snipe rival stickman archers across randomized cliffs.',
    controls: 'Click & Drag anywhere with <span class="key">MOUSE</span> to aim and set power, release to fire!',
    gradient: 'linear-gradient(135deg, #ffbe0b33, #ff007f33)',
    icon: `<svg viewBox="0 0 64 64" fill="none" stroke="#ffbe0b" stroke-width="3" stroke-linecap="round"><path d="M22 10c18 10 18 34 0 44"/><line x1="22" y1="10" x2="22" y2="54"/><line x1="12" y1="32" x2="52" y2="32"/><polyline points="45,26 52,32 45,38"/></svg>`
  },
  {
    id: 'cyber-2048',
    title: 'Cyber 2048',
    category: 'puzzle',
    tag: 'Puzzle',
    desc: 'Slide and fuse glowing energy cores to reach the legendary 2048 reactor tile.',
    controls: 'Use <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> or <span class="key">ARROW KEYS</span> to slide tiles',
    gradient: 'linear-gradient(135deg, #00ff8833, #00f3ff33)',
    icon: `<svg viewBox="0 0 64 64" fill="none" stroke="#00ff88" stroke-width="3"><rect x="10" y="10" width="20" height="20" rx="4"/><rect x="34" y="10" width="20" height="20" rx="4"/><rect x="10" y="34" width="20" height="20" rx="4"/><rect x="34" y="34" width="20" height="20" rx="4" fill="#00ff8844"/></svg>`
  },
  {
    id: 'memory-matrix',
    title: 'Neon Memory Matrix',
    category: 'puzzle',
    tag: 'Puzzle',
    desc: 'Test your brainpower. Memorize the glowing cyber-nodes before they vanish and replicate the grid.',
    controls: 'Click the tiles with <span class="key">MOUSE</span> after the pattern hides',
    gradient: 'linear-gradient(135deg, #9d4edd33, #00f3ff33)',
    icon: `<svg viewBox="0 0 64 64" fill="none" stroke="#9d4edd" stroke-width="3"><circle cx="20" cy="20" r="6" fill="#9d4edd"/><circle cx="44" cy="20" r="6"/><circle cx="20" cy="44" r="6"/><circle cx="44" cy="44" r="6" fill="#9d4edd"/><path d="M26 20h12M20 26v12M44 26v12"/></svg>`
  },
  {
    id: 'orbital-breaker',
    title: 'Orbital Brick Breaker',
    category: 'arcade',
    tag: 'Arcade',
    desc: 'Shatter neon plasma walls with high-velocity energy orbs and explosive particle showers.',
    controls: 'Move paddle with <span class="key">MOUSE</span> or <span class="key">◀</span> <span class="key">▶</span> Arrows &nbsp;|&nbsp; <span class="key">CLICK</span> / <span class="key">SPACE</span> Launch',
    gradient: 'linear-gradient(135deg, #ff540033, #ffbe0b33)',
    icon: `<svg viewBox="0 0 64 64" fill="none" stroke="#ff5400" stroke-width="3"><rect x="10" y="12" width="18" height="8" rx="2"/><rect x="36" y="12" width="18" height="8" rx="2"/><circle cx="32" cy="34" r="5" fill="#ffbe0b"/><rect x="18" y="50" width="28" height="6" rx="3" stroke="#00f3ff"/></svg>`
  }
];


const grid = document.getElementById('game-grid');
const filterBtns = document.querySelectorAll('.filter-btn');
const modal = document.getElementById('game-modal');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');


let activeGameId = null;
let animFrameId = null;
let gameCleanup = null;


function renderCards(filter = 'all') {
  grid.innerHTML = '';
  const filtered = filter === 'all' ? GAMES : GAMES.filter(g => g.category === filter);
  filtered.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.onclick = () => launchGame(game.id);
    card.innerHTML = `
      <div class="card-thumb" style="background: ${game.gradient}">
        <span class="card-tag">${game.tag}</span>
        ${game.icon}
      </div>
      <div class="card-body">
        <div>
          <div class="card-title">${game.title}</div>
          <div class="card-desc">${game.desc}</div>
        </div>
        <button class="play-btn">▶ PLAY NOW</button>
      </div>
    `;
    grid.appendChild(card);
  });
}


filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
});


renderCards();


function launchGame(id) {
  if (gameCleanup) gameCleanup();
  cancelAnimationFrame(animFrameId);
  
  const game = GAMES.find(g => g.id === id);
  activeGameId = id;
  document.getElementById('modal-game-title').textContent = game.title;
  document.getElementById('controls-hint').innerHTML = game.controls;
  modal.classList.add('active');


  ctx.clearRect(0, 0, canvas.width, canvas.height);


  switch (id) {
    case 'neon-drift': gameCleanup = startNeonDrift(); break;
    case 'stickman-brawl': gameCleanup = startStickmanBrawl(); break;
    case 'stickman-archer': gameCleanup = startStickmanArcher(); break;
    case 'cyber-2048': gameCleanup = startCyber2048(); break;
    case 'memory-matrix': gameCleanup = startMemoryMatrix(); break;
    case 'orbital-breaker': gameCleanup = startOrbitalBreaker(); break;
  }
}


function restartCurrentGame() {
  if (activeGameId) launchGame(activeGameId);
}


function closeGame() {
  if (gameCleanup) gameCleanup();
  cancelAnimationFrame(animFrameId);
  activeGameId = null;
  modal.classList.remove('active');
}


function startNeonDrift() {
  let keys = {};
  const onKeyDown = e => { keys[e.code] = true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); };
  const onKeyUp = e => { keys[e.code] = false; };
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);


  let player = { x: 400, y: 400, w: 36, h: 64, vx: 0, tilt: 0 };
  let enemies = [];
  let particles = [];
  let roadOffset = 0;
  let score = 0;
  let speed = 7;
  let gameOver = false;
  let spawnTimer = 0;


  const roadLeft = 220, roadRight = 580;


  function spawnEnemy() {
    const lanes = new Array(275, 355, 445, 525);
    const laneX = lanes[Math.floor(Math.random() * lanes.length)];
    const colors = new Array('#ff007f', '#ffbe0b', '#9d4edd', '#ff5400');
    enemies.push({
      x: laneX,
      y: -80,
      w: 36,
      h: 64,
      speed: 3 + Math.random() * 3,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }


  function loop() {
    ctx.fillStyle = '#07080f';
    ctx.fillRect(0, 0, 800, 500);


    ctx.strokeStyle = 'rgba(0, 243, 255, 0.12)';
    ctx.lineWidth = 1;
    for (let y = (roadOffset % 40); y < 500; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(roadLeft, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(roadRight, y); ctx.lineTo(800, y); ctx.stroke();
    }


    ctx.fillStyle = '#111424';
    ctx.fillRect(roadLeft, 0, roadRight - roadLeft, 500);


    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f3ff';
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(roadLeft - 4, 0, 4, 500);
    ctx.fillRect(roadRight, 0, 4, 500);
    ctx.shadowBlur = 0;


    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    const laneDividers = new Array(310, 400, 490);
    for (let lx of laneDividers) {
      for (let y = (roadOffset % 60) - 60; y < 500; y += 60) {
        ctx.fillRect(lx - 2, y, 4, 30);
      }
    }


    if (!gameOver) {
      const boosting = keys['Space'] || keys['KeyW'] || keys['ArrowUp'];
      const currentSpeed = boosting ? speed * 1.65 : speed;
      roadOffset += currentSpeed * 1.5;
      score += boosting ? 3 : 1;
      speed = Math.min(15, 7 + score / 1500);


      if (keys['KeyA'] || keys['ArrowLeft']) { player.vx -= 0.9; player.tilt = -0.15; }
      else if (keys['KeyD'] || keys['ArrowRight']) { player.vx += 0.9; player.tilt = 0.15; }
      else { player.vx *= 0.82; player.tilt *= 0.8; }


      player.x += player.vx;
      if (player.x < roadLeft + 24) { player.x = roadLeft + 24; player.vx = 0; }
      if (player.x > roadRight - 24) { player.x = roadRight - 24; player.vx = 0; }


      particles.push({
        x: player.x + (Math.random() - 0.5) * 14,
        y: player.y + 32,
        vy: currentSpeed * 0.6,
        life: 1,
        color: boosting ? '#00f3ff' : '#ff007f'
      });


      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(22, 55 - Math.floor(score / 250));
      }


      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += currentSpeed - e.speed * 0.4;
        if (Math.abs(e.x - player.x) < 30 && Math.abs(e.y - player.y) < 56) {
          gameOver = true;
        }
        if (e.y > 560) enemies.splice(i, 1);
      }
    }


    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.y += p.vy;
      p.life -= 0.06;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(p.x - 3, p.y, 6, 8);
      ctx.globalAlpha = 1;
    }


    enemies.forEach(e => {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.shadowBlur = 12;
      ctx.shadowColor = e.color;
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.roundRect(-e.w/2, -e.h/2, e.w, e.h, 8); ctx.fill();
      ctx.fillStyle = '#090b14';
      ctx.fillRect(-13, -12, 26, 18);
      ctx.restore();
    });


    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#00f3ff';
    ctx.fillStyle = '#00f3ff';
    ctx.beginPath(); ctx.roundRect(-player.w/2, -player.h/2, player.w, player.h, 8); ctx.fill();
    ctx.fillStyle = '#07080f';
    ctx.fillRect(-13, -14, 26, 16);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-14, -32, 7, 4);
    ctx.fillRect(7, -32, 7, 4);
    ctx.restore();


    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(`SCORE: ${score}`, 25, 40);
    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`SPEED: ${Math.floor(speed * 18)} MPH`, 25, 68);


    if (gameOver) {
      ctx.fillStyle = 'rgba(7, 8, 15, 0.8)';
      ctx.fillRect(0, 0, 800, 500);
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('WRECKED!', 400, 220);
      ctx.fillStyle = '#fff';
      ctx.font = '24px monospace';
      ctx.fillText(`FINAL SCORE: ${score}`, 400, 265);
      ctx.fillStyle = '#00f3ff';
      ctx.font = '18px sans-serif';
      ctx.fillText('Click "Restart" above to race again', 400, 310);
      ctx.textAlign = 'left';
    }


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
  };
}


function startStickmanBrawl() {
  let keys = {};
  const onKeyDown = e => {
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    if (!player.dead) {
      if ((e.code === 'KeyJ' || e.code === 'KeyZ') && player.attackCd <= 0) triggerAttack('punch');
      if ((e.code === 'KeyK' || e.code === 'KeyX') && player.attackCd <= 0) triggerAttack('kick');
      if ((e.code === 'KeyW' || e.code === 'ArrowUp') && player.onGround) {
        player.vy = -14;
        player.onGround = false;
      }
    }
  };
  const onKeyUp = e => { keys[e.code] = false; };
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);


  const groundY = 420;
  let player = { x: 400, y: groundY, vx: 0, vy: 0, dir: 1, hp: 100, maxHp: 100, onGround: true, attackType: null, attackTimer: 0, attackCd: 0, walkCycle: 0, dead: false };
  let enemies = [];
  let sparks = [];
  let wave = 1;
  let kills = 0;
  let shake = 0;


  function spawnWave() {
    const count = 1 + Math.floor(wave * 1.2);
    for (let i = 0; i < count; i++) {
      const side = Math.random() < 0.5 ? -40 - i * 60 : 840 + i * 60;
      enemies.push({
        x: side,
        y: groundY,
        vx: 0,
        hp: 30 + wave * 10,
        maxHp: 30 + wave * 10,
        speed: 2.2 + Math.min(2.5, wave * 0.2),
        attackCd: 40,
        walkCycle: Math.random() * 10,
        hitFlash: 0
      });
    }
  }
  spawnWave();


  function triggerAttack(type) {
    player.attackType = type;
    player.attackTimer = type === 'punch' ? 12 : 18;
    player.attackCd = type === 'punch' ? 16 : 26;
    const reach = type === 'punch' ? 65 : 85;
    const dmg = type === 'punch' ? 25 : 45;


    enemies.forEach(en => {
      const dx = en.x - player.x;
      if (Math.sign(dx) === player.dir && Math.abs(dx) < reach && Math.abs(en.y - player.y) < 60) {
        en.hp -= dmg;
        en.vx = player.dir * (type === 'punch' ? 8 : 14);
        en.hitFlash = 8;
        shake = type === 'punch' ? 4 : 9;
        for (let s = 0; s < 10; s++) {
          sparks.push({ x: en.x, y: en.y - 45, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1, color: type === 'punch' ? '#00f3ff' : '#ffbe0b' });
        }
      }
    });
  }


  function drawStickman(x, y, dir, color, walkCycle, attackType, isHit) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = isHit ? '#ffffff' : color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';


    const swing = Math.sin(walkCycle) * 14;
    ctx.beginPath(); ctx.arc(0, -68, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -57); ctx.lineTo(0, -28); ctx.stroke();


    ctx.beginPath();
    ctx.moveTo(0, -28);
    if (attackType === 'kick') {
      ctx.lineTo(dir * 38, -36);
      ctx.moveTo(0, -28);
      ctx.lineTo(-dir * 10, 0);
    } else {
      ctx.lineTo(-swing, 0);
      ctx.moveTo(0, -28);
      ctx.lineTo(swing, 0);
    }
    ctx.stroke();


    ctx.beginPath();
    ctx.moveTo(0, -50);
    if (attackType === 'punch') {
      ctx.lineTo(dir * 36, -50);
      ctx.moveTo(0, -50);
      ctx.lineTo(-dir * 12, -38);
    } else {
      ctx.lineTo(swing, -35);
      ctx.moveTo(0, -50);
      ctx.lineTo(-swing, -35);
    }
    ctx.stroke();
    ctx.restore();
  }


  function loop() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
      shake--;
    }


    ctx.fillStyle = '#090b16';
    ctx.fillRect(0, 0, 800, 500);


    ctx.fillStyle = '#14182e';
    ctx.fillRect(0, groundY, 800, 80);
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(800, groundY); ctx.stroke();


    if (!player.dead) {
      if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -5.5; player.dir = -1; player.walkCycle += 0.25; }
      else if (keys['KeyD'] || keys['ArrowRight']) { player.vx = 5.5; player.dir = 1; player.walkCycle += 0.25; }
      else { player.vx *= 0.75; }


      player.x = Math.max(30, Math.min(770, player.x + player.vx));
      player.y += player.vy;
      if (player.y < groundY) { player.vy += 0.7; player.onGround = false; }
      else { player.y = groundY; player.vy = 0; player.onGround = true; }


      if (player.attackTimer > 0) player.attackTimer--;
      else player.attackType = null;
      if (player.attackCd > 0) player.attackCd--;
    }


    for (let i = enemies.length - 1; i >= 0; i--) {
      let en = enemies[i];
      if (en.hp <= 0) {
        kills++;
        enemies.splice(i, 1);
        continue;
      }
      if (en.hitFlash > 0) en.hitFlash--;
      en.x += en.vx;
      en.vx *= 0.82;


      const dist = player.x - en.x;
      if (Math.abs(dist) > 42 && !player.dead) {
        en.x += Math.sign(dist) * en.speed;
        en.walkCycle += 0.2;
      } else if (!player.dead) {
        en.attackCd--;
        if (en.attackCd <= 0) {
          player.hp -= 10;
          en.attackCd = 55;
          shake = 5;
          if (player.hp <= 0) { player.hp = 0; player.dead = true; }
        }
      }


      drawStickman(en.x, en.y, Math.sign(dist) || 1, '#ff007f', en.walkCycle, en.attackCd > 45 ? 'punch' : null, en.hitFlash > 0);
      ctx.fillStyle = '#333';
      ctx.fillRect(en.x - 20, en.y - 90, 40, 5);
      ctx.fillStyle = '#ff007f';
      ctx.fillRect(en.x - 20, en.y - 90, 40 * (en.hp / en.maxHp), 5);
    }


    if (enemies.length === 0 && !player.dead) {
      wave++;
      player.hp = Math.min(player.maxHp, player.hp + 20);
      spawnWave();
    }


    if (!player.dead) {
      drawStickman(player.x, player.y, player.dir, '#00f3ff', player.walkCycle, player.attackType, false);
    }


    for (let i = sparks.length - 1; i >= 0; i--) {
      let s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.08;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.life;
      ctx.fillRect(s.x, s.y, 4, 4);
      ctx.globalAlpha = 1;
    }


    ctx.fillStyle = '#1e233a';
    ctx.fillRect(25, 25, 220, 18);
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(25, 25, 220 * (player.hp / player.maxHp), 18);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(25, 25, 220, 18);


    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(`WAVE: ${wave}   KILLS: ${kills}`, 560, 40);


    if (player.dead) {
      ctx.fillStyle = 'rgba(7,8,15,0.8)';
      ctx.fillRect(0, 0, 800, 500);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 48px sans-serif';
      ctx.fillText('KNOCKED OUT', 400, 220);
      ctx.fillStyle = '#fff';
      ctx.font = '22px monospace';
      ctx.fillText(`WAVE REACHED: ${wave} | TOTAL KILLS: ${kills}`, 400, 265);
      ctx.textAlign = 'left';
    }


    ctx.restore();
    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
  };
}


function startStickmanArcher() {
  let dragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragCurrent = { x: 0, y: 0 };


  let player = { x: 120, y: 380, hp: 100 };
  let enemy = { x: 680, y: 320, hp: 100 };
  let arrows = [];
  let turn = 'player';
  let wins = 0;
  let message = 'Drag mouse to aim & shoot!';


  function resetRound() {
    player.y = 280 + Math.random() * 140;
    enemy.y = 220 + Math.random() * 180;
    player.hp = 100;
    enemy.hp = 100;
    arrows = [];
    turn = 'player';
  }
  resetRound();


  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  };


  const onDown = e => {
    if (turn !== 'player') return;
    dragging = true;
    dragStart = getPos(e);
    dragCurrent = dragStart;
  };
  const onMove = e => {
    if (dragging) dragCurrent = getPos(e);
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    const dx = dragStart.x - dragCurrent.x;
    const dy = dragStart.y - dragCurrent.y;
    const power = Math.min(22, Math.hypot(dx, dy) * 0.12);
    if (power > 2) {
      const angle = Math.atan2(dy, dx);
      arrows.push({
        x: player.x + 15,
        y: player.y - 45,
        vx: Math.cos(angle) * power,
        vy: Math.sin(angle) * power,
        owner: 'player'
      });
      turn = 'flight';
    }
  };


  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);


  function enemyShoot() {
    const dx = player.x - enemy.x;
    const dy = (player.y - 40) - (enemy.y - 45);
    const flightTime = 55;
    const vx = (dx / flightTime) + (Math.random() - 0.5) * 1.6;
    const vy = (dy - 0.5 * 0.35 * flightTime * flightTime) / flightTime + (Math.random() - 0.5) * 1.4;
    arrows.push({ x: enemy.x - 15, y: enemy.y - 45, vx, vy, owner: 'enemy' });
    turn = 'flight';
  }


  function drawArcher(x, y, color, facingRight) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.lineWidth = 3.5;
    ctx.fillStyle = '#181d36';
    ctx.fillRect(-35, 0, 70, 500 - y);
    ctx.strokeRect(-35, 0, 70, 500 - y);
    ctx.beginPath(); ctx.arc(0, -62, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -52); ctx.lineTo(0, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(-10, 0); ctx.moveTo(0, -24); ctx.lineTo(10, 0); ctx.stroke();
    const dir = facingRight ? 1 : -1;
    ctx.beginPath();
    ctx.arc(dir * 12, -42, 16, -Math.PI/2, Math.PI/2, !facingRight);
    ctx.stroke();
    ctx.restore();
  }


  function loop() {
    ctx.fillStyle = '#080a14';
    ctx.fillRect(0, 0, 800, 500);


    drawArcher(player.x, player.y, '#00f3ff', true);
    drawArcher(enemy.x, enemy.y, '#ff007f', false);


    if (dragging && turn === 'player') {
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const power = Math.min(22, Math.hypot(dx, dy) * 0.12);
      const angle = Math.atan2(dy, dx);
      let vx = Math.cos(angle) * power;
      let vy = Math.sin(angle) * power;
      let px = player.x + 15;
      let py = player.y - 45;


      ctx.fillStyle = '#ffbe0b';
      for (let t = 0; t < 25; t++) {
        px += vx; py += vy; vy += 0.35;
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
      }
    }


    for (let i = arrows.length - 1; i >= 0; i--) {
      let a = arrows[i];
      a.x += a.vx;
      a.y += a.vy;
      a.vy += 0.35;


      const ang = Math.atan2(a.vy, a.vx);
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(ang);
      ctx.strokeStyle = a.owner === 'player' ? '#00f3ff' : '#ff007f';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke();
      ctx.restore();


      if (a.owner === 'player' && Math.abs(a.x - enemy.x) < 20 && a.y > enemy.y - 75 && a.y < enemy.y) {
        const headshot = a.y < enemy.y - 50;
        enemy.hp -= headshot ? 60 : 35;
        message = headshot ? 'HEADSHOT! -60 HP' : 'DIRECT HIT! -35 HP';
        arrows.splice(i, 1);
        if (enemy.hp <= 0) {
          wins++;
          message = 'VICTORY! Next opponent...';
          setTimeout(resetRound, 1000);
        } else {
          setTimeout(enemyShoot, 600);
        }
        continue;
      }


      if (a.owner === 'enemy' && Math.abs(a.x - player.x) < 20 && a.y > player.y - 75 && a.y < player.y) {
        player.hp -= 35;
        message = 'YOU GOT HIT! -35 HP';
        arrows.splice(i, 1);
        if (player.hp <= 0) {
          wins = 0;
          message = 'DEFEATED! Resetting match...';
          setTimeout(resetRound, 1200);
        } else {
          turn = 'player';
        }
        continue;
      }


      if (a.y > 510 || a.x < -20 || a.x > 820) {
        arrows.splice(i, 1);
        if (a.owner === 'player') setTimeout(enemyShoot, 500);
        else turn = 'player';
      }
    }


    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(`YOU: ${Math.max(0, player.hp)} HP`, 40, 40);
    ctx.fillStyle = '#ff007f';
    ctx.fillText(`RIVAL: ${Math.max(0, enemy.hp)} HP`, 630, 40);
    ctx.fillStyle = '#ffbe0b';
    ctx.textAlign = 'center';
    ctx.fillText(`WIN STREAK: ${wins}`, 400, 40);
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.fillText(message, 400, 70);
    ctx.textAlign = 'left';


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    canvas.removeEventListener('mousedown', onDown);
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  };
}


function startCyber2048() {
  let grid = Array.from({ length: 4 }, () => Array(4).fill(0));
  let score = 0;


  function addTile() {
    let empty = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (grid[r][c] === 0) empty.push({ r, c });
    if (empty.length > 0) {
      let { r, c } = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
  }
  addTile(); addTile();


  function slide(row) {
    let arr = row.filter(val => val);
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        score += arr[i];
        arr[i + 1] = 0;
      }
    }
    arr = arr.filter(val => val);
    while (arr.length < 4) arr.push(0);
    return arr;
  }


  function move(dir) {
    let prev = JSON.stringify(grid);
    if (dir === 'left') {
      for (let r = 0; r < 4; r++) grid[r] = slide(grid[r]);
    } else if (dir === 'right') {
      for (let r = 0; r < 4; r++) grid[r] = slide(grid[r].reverse()).reverse();
    } else if (dir === 'up') {
      for (let c = 0; c < 4; c++) {
        let col = slide(new Array(grid[c], grid[c], grid[c], grid[c]));
        for (let r = 0; r < 4; r++) grid[r][c] = col[r];
      }
    } else if (dir === 'down') {
      for (let c = 0; c < 4; c++) {
        let col = slide(new Array(grid[c], grid[c], grid[c], grid[c])).reverse();
        for (let r = 0; r < 4; r++) grid[r][c] = col[r];
      }
    }
    if (JSON.stringify(grid) !== prev) addTile();
  }


  const onKeyDown = e => {
    if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
    if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
    if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
    if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
  };
  window.addEventListener('keydown', onKeyDown);


  const tileColors = {
    0: '#14182e', 2: '#1b264f', 4: '#274690', 8: '#0099ff',
    16: '#00f3ff', 32: '#00ff88', 64: '#9d4edd', 128: '#ff007f',
    256: '#ff5400', 512: '#ffbe0b', 1024: '#ffffff', 2048: '#00ff88'
  };


  function loop() {
    ctx.fillStyle = '#080a14';
    ctx.fillRect(0, 0, 800, 500);


    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px monospace';
    ctx.fillText(`SCORE: ${score}`, 220, 48);


    const startX = 220, startY = 70, size = 82, gap = 10;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const val = grid[r][c];
        const x = startX + c * (size + gap);
        const y = startY + r * (size + gap);
        ctx.fillStyle = tileColors[val] || '#ff007f';
        ctx.beginPath(); ctx.roundRect(x, y, size, size, 10); ctx.fill();


        if (val > 0) {
          ctx.fillStyle = val >= 16 && val <= 32 ? '#000' : '#fff';
          ctx.font = '900 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(val, x + size / 2, y + size / 2);
        }
      }
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => window.removeEventListener('keydown', onKeyDown);
}


function startMemoryMatrix() {
  let level = 1;
  let gridSize = 3;
  let targetTiles = new Set();
  let selectedTiles = new Set();
  let wrongTiles = new Set();
  let state = 'memorize';
  let timer = 90;


  function setupLevel() {
    gridSize = level < 3 ? 3 : level < 6 ? 4 : 5;
    const count = Math.min(gridSize * gridSize - 2, 2 + level);
    targetTiles.clear();
    selectedTiles.clear();
    wrongTiles.clear();
    while (targetTiles.size < count) {
      targetTiles.add(Math.floor(Math.random() * (gridSize * gridSize)));
    }
    state = 'memorize';
    timer = 85;
  }
  setupLevel();


  const onClick = e => {
    if (state !== 'recall') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);


    const tileSize = gridSize === 3 ? 95 : gridSize === 4 ? 75 : 62;
    const gap = 12;
    const totalW = gridSize * tileSize + (gridSize - 1) * gap;
    const startX = (800 - totalW) / 2;
    const startY = 110;


    for (let r = 0; r < gridSize; r++) {
      for (let c = 0; c < gridSize; c++) {
        const idx = r * gridSize + c;
        const x = startX + c * (tileSize + gap);
        const y = startY + r * (tileSize + gap);
        if (mx >= x && mx <= x + tileSize && my >= y && my <= y + tileSize) {
          if (targetTiles.has(idx)) {
            selectedTiles.add(idx);
            if (selectedTiles.size === targetTiles.size) {
              state = 'transition';
              setTimeout(() => { level++; setupLevel(); }, 700);
            }
          } else {
            wrongTiles.add(idx);
            state = 'transition';
            setTimeout(() => { level = Math.max(1, level - 1); setupLevel(); }, 900);
          }
        }
      }
    }
  };
  canvas.addEventListener('click', onClick);


  function loop() {
    ctx.fillStyle = '#080a14';
    ctx.fillRect(0, 0, 800, 500);


    if (state === 'memorize') {
      timer--;
      if (timer <= 0) state = 'recall';
    }


    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 26px monospace';
    ctx.fillText(`LEVEL ${level}`, 400, 45);
    ctx.fillStyle = state === 'memorize' ? '#ffbe0b' : '#00ff88';
    ctx.font = '18px sans-serif';
    ctx.fillText(state === 'memorize' ? 'MEMORIZE THE GLOWING NODES...' : 'CLICK THE NODES YOU SAW!', 400, 78);
    ctx.textAlign = 'left';


    const tileSize = gridSize === 3 ? 95 : gridSize === 4 ? 75 : 62;
    const gap = 12;
    const totalW = gridSize * tileSize + (gridSize - 1) * gap;
    const startX = (800 - totalW) / 2;
    const startY = 110;


    for (let r = 0; r < gridSize; r++) {
      for (let c = 0; c < gridSize; c++) {
        const idx = r * gridSize + c;
        const x = startX + c * (tileSize + gap);
        const y = startY + r * (tileSize + gap);


        let color = '#161b33';
        if (state === 'memorize' && targetTiles.has(idx)) color = '#00f3ff';
        else if (selectedTiles.has(idx)) color = '#00ff88';
        else if (wrongTiles.has(idx)) color = '#ff007f';


        ctx.fillStyle = color;
        ctx.beginPath(); ctx.roundRect(x, y, tileSize, tileSize, 10); ctx.fill();
      }
    }


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => canvas.removeEventListener('click', onClick);
}


function startOrbitalBreaker() {
  let paddle = { x: 340, y: 460, w: 120, h: 14 };
  let ball = { x: 400, y: 440, r: 8, vx: 4.5, vy: -4.5, launched: false };
  let bricks = [];
  let particles = [];
  let score = 0;
  let lives = 3;


  const colors = ['#ff007f', '#9d4edd', '#00f3ff', '#00ff88', '#ffbe0b'];
  function buildBricks() {
    bricks = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 10; c++) {
        bricks.push({ x: 45 + c * 72, y: 65 + r * 28, w: 64, h: 18, color: colors[r], alive: true });
      }
    }
  }
  buildBricks();


  const onMouseMove = e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.max(0, Math.min(800 - paddle.w, mx - paddle.w / 2));
  };
  const onClick = () => { if (!ball.launched) ball.launched = true; };
  const onKeyDown = e => {
    if (e.code === 'Space' && !ball.launched) { e.preventDefault(); ball.launched = true; }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') paddle.x = Math.max(0, paddle.x - 35);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') paddle.x = Math.min(800 - paddle.w, paddle.x + 35);
  };


  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('click', onClick);
  window.addEventListener('keydown', onKeyDown);


  function loop() {
    ctx.fillStyle = '#080a14';
    ctx.fillRect(0, 0, 800, 500);


    if (!ball.launched) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
    } else if (lives > 0) {
      ball.x += ball.vx;
      ball.y += ball.vy;


      if (ball.x - ball.r < 0 || ball.x + ball.r > 800) ball.vx *= -1;
      if (ball.y - ball.r < 0) ball.vy *= -1;


      if (ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
        const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hitPos * 6.5;
        ball.vy = -Math.abs(ball.vy);
      }


      bricks.forEach(b => {
        if (!b.alive) return;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          ball.vy *= -1;
          score += 100;
          for (let p = 0; p < 12; p++) {
            particles.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1, color: b.color });
          }
        }
      });


      if (bricks.every(b => !b.alive)) {
        buildBricks();
        ball.launched = false;
      }


      if (ball.y > 510) {
        lives--;
        ball.launched = false;
        ball.vx = 4.5;
        ball.vy = -4.5;
      }
    }


    bricks.forEach(b => {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = b.color;
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
    });
    ctx.shadowBlur = 0;


    ctx.fillStyle = '#00f3ff';
    ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();


    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();


    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.05;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(p.x, p.y, 4, 4);
      ctx.globalAlpha = 1;
    }


    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(`SCORE: ${score}`, 45, 38);
    ctx.fillStyle = '#ff007f';
    ctx.fillText(`LIVES: ${'♥'.repeat(Math.max(0, lives))}`, 640, 38);


    if (lives <= 0) {
      ctx.fillStyle = 'rgba(7,8,15,0.82)';
      ctx.fillRect(0, 0, 800, 500);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 46px sans-serif';
      ctx.fillText('GAME OVER', 400, 230);
      ctx.fillStyle = '#fff';
      ctx.font = '22px monospace';
      ctx.fillText(`FINAL SCORE: ${score}`, 400, 275);
      ctx.textAlign = 'left';
    }


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    canvas.removeEventListener('mousemove', onMouseMove);
    canvas.removeEventListener('click', onClick);
    window.removeEventListener('keydown', onKeyDown);
  };
}

function startCyberScratch() {
  const PALETTE = new Array(
    { type: 'wasd', label: 'Enable WASD Move', color: '#00ff88' },
    { type: 'gravity', label: 'Platformer Gravity', color: '#00ff88' },
    { type: 'star', label: 'Spawn Star Goal', color: '#ffbe0b' },
    { type: 'laser', label: 'Spawn Moving Laser', color: '#ff007f' },
    { type: 'move', label: 'Auto-Move 45 Steps', color: '#0099ff' },
    { type: 'turnR', label: 'Turn Right 45°', color: '#0099ff' },
    { type: 'color', label: 'Switch Neon Color', color: '#9d4edd' },
    { type: 'loop3', label: 'Repeat Auto x3', color: '#ff5400' }
  );


  // Starter playable dodge-and-collect mini-game!
  let script = new Array(
    { type: 'wasd', label: 'Enable WASD Move', color: '#00ff88' },
    { type: 'star', label: 'Spawn Star Goal', color: '#ffbe0b' },
    { type: 'star', label: 'Spawn Star Goal', color: '#ffbe0b' },
    { type: 'laser', label: 'Spawn Moving Laser', color: '#ff007f' }
  );


  let keys = {};
  const onKeyDown = e => {
    keys[e.code] = true;
    if (new Array('Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight').includes(e.code)) e.preventDefault();
  };
  const onKeyUp = e => { keys[e.code] = false; };
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);


  const neonColors = new Array('#00f3ff', '#ff007f', '#00ff88', '#ffbe0b', '#9d4edd');
  let bot = { x: 560, y: 260, vy: 0, angle: 0, colorIdx: 0 };
  let stars = new Array();
  let lasers = new Array();
  let starsCollected = 0;
  let runningQueue = new Array();
  let execTimer = 0;
  let wasdEnabled = false;
  let gravityEnabled = false;
  let isPlaying = false;
  let statusMsg = 'Click RUN to play your game!';
  let buttons = new Array();


  function resetStage() {
    bot = { x: 430, y: 380, vy: 0, angle: 0, colorIdx: 0 };
    stars = new Array();
    lasers = new Array();
    starsCollected = 0;
    runningQueue = new Array();
    wasdEnabled = false;
    gravityEnabled = false;
    isPlaying = false;
  }


  function runScript() {
    if (script.length === 0) {
      statusMsg = 'Add at least 1 block first!';
      return;
    }
    resetStage();
    isPlaying = true;
    let expanded = new Array();
    let loops = 1;
    script.forEach(b => {
      if (b.type === 'loop3') loops += 2;
      else expanded.push(b);
    });
    for (let i = 0; i < loops; i++) {
      runningQueue.push(...expanded);
    }
    statusMsg = 'GAME LIVE! Use WASD / Arrows!';
  }


  function saveSlot(slotNum) {
    try {
      localStorage.setItem(`nexus_scratch_slot_${slotNum}`, JSON.stringify(script));
      statusMsg = `Saved to Game Slot #${slotNum}!`;
    } catch (e) {
      statusMsg = 'Storage blocked by browser.';
    }
  }


  function loadSlot(slotNum) {
    try {
      const raw = localStorage.getItem(`nexus_scratch_slot_${slotNum}`);
      if (!raw) {
        statusMsg = `Slot #${slotNum} is empty!`;
        return;
      }
      script = JSON.parse(raw);
      resetStage();
      statusMsg = `Loaded Slot #${slotNum}! Hit RUN!`;
    } catch (e) {
      statusMsg = 'Could not load slot.';
    }
  }


  function executeStep(step) {
    if (step.type === 'wasd') {
      wasdEnabled = true;
    } else if (step.type === 'gravity') {
      gravityEnabled = true;
    } else if (step.type === 'move') {
      const rad = (bot.angle * Math.PI) / 180;
      bot.x += Math.cos(rad) * 45;
      bot.y += Math.sin(rad) * 45;
    } else if (step.type === 'turnR') {
      bot.angle = (bot.angle + 45) % 360;
    } else if (step.type === 'star') {
      stars.push({
        x: 410 + Math.random() * 340,
        y: 100 + Math.random() * 300
      });
    } else if (step.type === 'laser') {
      lasers.push({
        x: 420 + Math.random() * 320,
        y: 120 + Math.random() * 260,
        vx: (Math.random() < 0.5 ? -1 : 1) * 3.2,
        w: 55,
        h: 8
      });
    } else if (step.type === 'color') {
      bot.colorIdx = (bot.colorIdx + 1) % neonColors.length;
    }
  }


  const onClick = e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);


    for (let btn of buttons) {
      if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
        btn.action();
        return;
      }
    }
  };
  canvas.addEventListener('click', onClick);


  function drawBtn(x, y, w, h, bg, text, textColor, action) {
    buttons.push({ x, y, w, h, action });
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 6);
    ctx.fill();
    ctx.fillStyle = textColor;
    ctx.font = 'bold 11.5px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }


  function loop() {
    buttons = new Array();
    ctx.fillStyle = '#080a14';
    ctx.fillRect(0, 0, 800, 500);


    // Execute queued blocks
    if (runningQueue.length > 0) {
      execTimer++;
      if (execTimer >= 8) {
        execTimer = 0;
        executeStep(runningQueue.shift());
      }
    }


    // Live Gameplay Physics
    if (isPlaying) {
      if (wasdEnabled) {
        if (keys['KeyA'] || keys['ArrowLeft']) { bot.x -= 4.5; bot.angle = 180; }
        if (keys['KeyD'] || keys['ArrowRight']) { bot.x += 4.5; bot.angle = 0; }
        if (gravityEnabled) {
          if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space']) && bot.y >= 418) {
            bot.vy = -11.5;
          }
        } else {
          if (keys['KeyW'] || keys['ArrowUp']) { bot.y -= 4.5; bot.angle = 270; }
          if (keys['KeyS'] || keys['ArrowDown']) { bot.y += 4.5; bot.angle = 90; }
        }
      }


      if (gravityEnabled) {
        bot.y += bot.vy;
        if (bot.y < 420) bot.vy += 0.55;
        else { bot.y = 420; bot.vy = 0; }
      }


      // Keep inside stage boundaries
      bot.x = Math.max(385, Math.min(770, bot.x));
      bot.y = Math.max(85, Math.min(425, bot.y));


      // Star collection
      for (let i = stars.length - 1; i >= 0; i--) {
        if (Math.hypot(bot.x - stars[i].x, bot.y - stars[i].y) < 28) {
          stars.splice(i, 1);
          starsCollected++;
          if (stars.length === 0) statusMsg = 'YOU COLLECTED ALL STARS! GG!';
        }
      }


      // Moving lasers & hit check
      for (let l of lasers) {
        l.x += l.vx;
        if (l.x < 375 || l.x + l.w > 780) l.vx *= -1;
        if (bot.x + 12 > l.x && bot.x - 12 < l.x + l.w &&
            bot.y + 12 > l.y && bot.y - 12 < l.y + l.h) {
          statusMsg = 'ZAPPED BY LASER! Hit RUN to retry!';
          isPlaying = false;
        }
      }
    }


    // Column 1: Block Palette
    ctx.fillStyle = '#101322';
    ctx.fillRect(10, 10, 165, 480);
    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('1. CODE BLOCKS', 20, 30);


    PALETTE.forEach((item, idx) => {
      drawBtn(18, 42 + idx * 42, 148, 34, item.color, `+ ${item.label}`, '#000', () => {
        if (script.length < 10) {
          script.push({ ...item });
          statusMsg = `Added "${item.label}"`;
        } else {
          statusMsg = 'Max 10 blocks in stack!';
        }
      });
    });


    drawBtn(18, 442, 148, 36, '#ff007f', 'CLEAR SCRIPT', '#fff', () => {
      script = new Array();
      resetStage();
      statusMsg = 'Script cleared.';
    });


    // Column 2: Active Script Stack
    ctx.fillStyle = '#101322';
    ctx.fillRect(185, 10, 170, 480);
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(`2. YOUR STACK (${script.length}/10)`, 195, 30);


    script.forEach((blk, idx) => {
      drawBtn(193, 42 + idx * 38, 154, 32, blk.color, `${idx + 1}. ${blk.label} ✕`, '#000', () => {
        script.splice(idx, 1);
        statusMsg = 'Removed block.';
      });
    });


    // Column 3: Live Stage & Save Slots
    ctx.fillStyle = '#0d101d';
    ctx.fillRect(365, 65, 425, 380);
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(365, 65, 425, 380);


    // Platform floor line if gravity is on
    if (gravityEnabled) {
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(365, 438);
      ctx.lineTo(790, 438);
      ctx.stroke();
    }


    drawBtn(365, 14, 72, 38, '#00ff88', '▶ RUN', '#000', runScript);


    for (let s = 1; s <= 3; s++) {
      const baseX = 446 + (s - 1) * 116;
      const hasData = !!localStorage.getItem(`nexus_scratch_slot_${s}`);
      drawBtn(baseX, 14, 54, 38, '#1e243d', `SAVE ${s}`, '#00f3ff', () => saveSlot(s));
      drawBtn(baseX + 57, 14, 54, 38, hasData ? '#ffbe0b' : '#161a2e', `LOAD ${s}`, hasData ? '#000' : '#666', () => loadSlot(s));
    }


    // Draw Stars
    stars.forEach(st => {
      ctx.fillStyle = '#ffbe0b';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ffbe0b';
      ctx.beginPath();
      ctx.arc(st.x, st.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });


    // Draw Moving Lasers
    lasers.forEach(l => {
      ctx.fillStyle = '#ff007f';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff007f';
      ctx.fillRect(l.x, l.y, l.w, l.h);
      ctx.shadowBlur = 0;
    });


    // Draw Cyber-Bot Sprite
    const botColor = neonColors[bot.colorIdx];
    ctx.save();
    ctx.translate(bot.x, bot.y);
    ctx.rotate((bot.angle * Math.PI) / 180);
    ctx.shadowBlur = 15;
    ctx.shadowColor = botColor;
    ctx.fillStyle = botColor;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-14, -13);
    ctx.lineTo(-9, 0);
    ctx.lineTo(-14, 13);
    ctx.closePath();
    ctx.fill();
    ctx.restore();


    // Stage Footer Status
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(statusMsg, 370, 472);
    ctx.fillStyle = '#ffbe0b';
    ctx.fillText(`STARS: ${starsCollected}`, 705, 472);


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    canvas.removeEventListener('click', onClick);
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
  };
}

    const slashY = player.y + player.dirY * 36;
    const reach = player.swordLevel > 1 ? 52 : 42;


    const rm = rooms[currentRoom];
    for (let i = rm.enemies.length - 1; i >= 0; i--) {
      let en = rm.enemies[i];
      if (Math.hypot(en.x - slashX, en.y - slashY) < reach + en.r) {
        en.hp -= player.dmg;
        en.hitFlash = 7;
        en.x += player.dirX * 16;
        en.y += player.dirY * 16;
        spawnSparks(en.x, en.y, '#00f3ff', 10);


        if (en.hp <= 0) {
          spawnSparks(en.x, en.y, en.color, 20);
          rm.coins.push({ x: en.x, y: en.y, val: en.isBoss ? 100 : 15 });
          if (en.isBoss) {
            victory = true;
          }
          rm.enemies.splice(i, 1);
        }
      }
    }
  }


  function handleInteract() {
    const rm = rooms[currentRoom];
    for (let npc of rm.npcs) {
      if (Math.hypot(player.x - npc.x, player.y - npc.y) < 55) {
        if (npc.type === 'healer') {
          player.hp = player.maxHp;
          spawnSparks(player.x, player.y, '#00ff88', 15);
          showBanner('HP fully restored!');
        } else if (npc.type === 'shop_sword') {
          if (player.gold >= 30) {
            player.gold -= 30;
            player.dmg += 15;
            player.swordLevel++;
            spawnSparks(player.x, player.y, '#00f3ff', 18);
            showBanner(`Plasma Blade Lv.${player.swordLevel}! (${player.dmg} DMG)`);
          } else {
            showBanner('Need 30 Gold for Sword Upgrade!');
          }
        } else if (npc.type === 'shop_hp') {
          if (player.gold >= 25) {
            player.gold -= 25;
            player.maxHp += 40;
            player.hp = player.maxHp;
            spawnSparks(player.x, player.y, '#00ff88', 18);
            showBanner(`Max HP increased to ${player.maxHp}!`);
          } else {
            showBanner('Need 25 Gold for Max HP Boost!');
          }
        } else if (npc.type === 'key_chest') {
          if (rm.enemies.length > 0) {
            showBanner('Defeat all guardians in this room first!');
          } else if (!npc.opened) {
            npc.opened = true;
            player.hasKey = true;
            npc.label = 'CHEST OPENED';
            spawnSparks(npc.x, npc.y, '#ffbe0b', 25);
            showBanner('OBTAINED MASTER KEY! Head to the South Vault!');
          }
        }
      }
    }
  }


  function updateLogic() {
    if (player.dead || victory) return;


    if (bannerTimer > 0) bannerTimer--;
    if (player.slashTimer > 0) player.slashTimer--;
    if (player.slashCd > 0) player.slashCd--;
    if (player.invuln > 0) player.invuln--;


    let mx = 0, my = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;


    if (mx !== 0 || my !== 0) {
      const len = Math.hypot(mx, my);
      player.dirX = mx / len;
      player.dirY = my / len;
      player.x += player.dirX * player.speed;
      player.y += player.dirY * player.speed;
    }


    const rm = rooms[currentRoom];


    // Room Door Transitions
    if (player.x < 55 && rm.exits.left && Math.abs(player.y - 260) < 45) {
      currentRoom = rm.exits.left; player.x = 720; showBanner(`Entered ${rooms[currentRoom].name}`);
    } else if (player.x > 745 && rm.exits.right && Math.abs(player.y - 260) < 45) {
      currentRoom = rm.exits.right; player.x = 80; showBanner(`Entered ${rooms[currentRoom].name}`);
    } else if (player.y < 75 && rm.exits.top && Math.abs(player.x - 400) < 55) {
      currentRoom = rm.exits.top; player.y = 435; showBanner(`Entered ${rooms[currentRoom].name}`);
    } else if (player.y > 455 && rm.exits.bottom && Math.abs(player.x - 400) < 55) {
      if (rm.exits.bottom === 'boss' && !player.hasKey) {
        player.y = 450;
        showBanner('LOCKED! Find the Master Key in the North Sanctum!');
      } else {
        currentRoom = rm.exits.bottom; player.y = 95; showBanner(`Entered ${rooms[currentRoom].name}`);
      }
    }


    // Wall bounds
    player.x = Math.max(58, Math.min(742, player.x));
    player.y = Math.max(78, Math.min(452, player.y));


    // Collect coins
    for (let i = rm.coins.length - 1; i >= 0; i--) {
      let c = rm.coins[i];
      if (Math.hypot(player.x - c.x, player.y - c.y) < player.r + 12) {
        player.gold += c.val;
        spawnSparks(c.x, c.y, '#ffbe0b', 8);
        rm.coins.splice(i, 1);
      }
    }


    // Enemy chase & damage
    for (let en of rm.enemies) {
      if (en.hitFlash > 0) en.hitFlash--;
      const dx = player.x - en.x;
      const dy = player.y - en.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 1) {
        en.x += (dx / dist) * en.speed;
        en.y += (dy / dist) * en.speed;
      }
      if (dist < player.r + en.r && player.invuln <= 0) {
        player.hp -= en.isBoss ? 22 : 12;
        player.invuln = 35;
        spawnSparks(player.x, player.y, '#ff007f', 12);
        if (player.hp <= 0) {
          player.hp = 0;
          player.dead = true;
        }
      }
    }
  }


  function loop() {
    updateLogic();


    ctx.fillStyle = '#07080f';
    ctx.fillRect(0, 0, 800, 500);


    // Dungeon Floor & Walls
    ctx.fillStyle = '#0e1222';
    ctx.fillRect(40, 60, 720, 410);
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 4;
    ctx.strokeRect(40, 60, 720, 410);


    // Subtle Floor Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (let gx = 40; gx <= 760; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, 60); ctx.lineTo(gx, 470); ctx.stroke();
    }
    for (let gy = 60; gy <= 470; gy += 40) {
      ctx.beginPath(); ctx.moveTo(40, gy); ctx.lineTo(760, gy); ctx.stroke();
    }


    const rm = rooms[currentRoom];


    // Draw Doorways
    ctx.fillStyle = '#00ff88';
    if (rm.exits.left) ctx.fillRect(36, 220, 8, 80);
    if (rm.exits.right) ctx.fillRect(756, 220, 8, 80);
    if (rm.exits.top) ctx.fillRect(355, 56, 90, 8);
    if (rm.exits.bottom) {
      ctx.fillStyle = (rm.exits.bottom === 'boss' && !player.hasKey) ? '#ff007f' : '#00ff88';
      ctx.fillRect(355, 466, 90, 8);
    }


    // Draw NPCs / Shrines / Chests
    rm.npcs.forEach(npc => {
      ctx.fillStyle = npc.type === 'healer' ? '#00ff88' : npc.type === 'key_chest' ? '#ffbe0b' : '#00f3ff';
      ctx.shadowBlur = 12;
      ctx.shadowColor = ctx.fillStyle;
      ctx.beginPath();
      ctx.roundRect(npc.x - 16, npc.y - 16, 32, 32, 6);
      ctx.fill();
      ctx.shadowBlur = 0;


      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(npc.label, npc.x, npc.y - 24);
      ctx.textAlign = 'left';
    });


    // Draw Gold Coins
    rm.coins.forEach(c => {
      ctx.fillStyle = '#ffbe0b';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#ffbe0b';
      ctx.beginPath();
      ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });


    // Draw Enemies
    rm.enemies.forEach(en => {
      ctx.fillStyle = en.hitFlash > 0 ? '#ffffff' : en.color;
      ctx.shadowBlur = 14;
      ctx.shadowColor = en.color;
      ctx.beginPath();
      ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;


      // Enemy HP Bar
      const bw = en.isBoss ? 80 : 34;
      ctx.fillStyle = '#222';
      ctx.fillRect(en.x - bw / 2, en.y - en.r - 12, bw, 5);
      ctx.fillStyle = en.color;
      ctx.fillRect(en.x - bw / 2, en.y - en.r - 12, bw * (en.hp / en.maxHp), 5);
    });


    // Draw Player
    if (!player.dead) {
      ctx.save();
      ctx.translate(player.x, player.y);
      if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#00f3ff';
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#00f3ff';
      ctx.beginPath();
      ctx.arc(0, 0, player.r, 0, Math.PI * 2);
      ctx.fill();


      // Facing pointer
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(player.dirX * 20, player.dirY * 20);
      ctx.stroke();


      // Sword Slash Arc
      if (player.slashTimer > 0) {
        const ang = Math.atan2(player.dirY, player.dirX);
        ctx.strokeStyle = player.swordLevel > 1 ? '#ffbe0b' : '#00ff88';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 0, player.swordLevel > 1 ? 48 : 38, ang - 0.9, ang + 0.9);
        ctx.stroke();
      }
      ctx.restore();
    }


    // Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.06;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      ctx.globalAlpha = 1;
    }


    // Top HUD Bar
    ctx.fillStyle = '#1e233a';
    ctx.fillRect(40, 18, 170, 18);
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(40, 18, 170 * (player.hp / player.maxHp), 18);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(40, 18, 170, 18);


    ctx.fillStyle = '#ffbe0b';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`GOLD: ${player.gold}G`, 225, 33);


    ctx.fillStyle = '#00f3ff';
    ctx.fillText(`BLADE LV.${player.swordLevel}`, 345, 33);


    ctx.fillStyle = player.hasKey ? '#ffbe0b' : '#555';
    ctx.fillText(player.hasKey ? 'KEY: YES' : 'KEY: NO', 475, 33);


    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.fillText(rm.name, 760, 33);
    ctx.textAlign = 'left';


    // Bottom Status Banner
    if (bannerTimer > 0) {
      ctx.fillStyle = 'rgba(16, 19, 34, 0.85)';
      ctx.fillRect(150, 425, 500, 30);
      ctx.fillStyle = '#00f3ff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(bannerText, 400, 444);
      ctx.textAlign = 'left';
    }


    // Game Over / Victory Overlay
    if (player.dead || victory) {
      ctx.fillStyle = 'rgba(7, 8, 15, 0.85)';
      ctx.fillRect(0, 0, 800, 500);
      ctx.textAlign = 'center';
      ctx.fillStyle = victory ? '#00ff88' : '#ff007f';
      ctx.font = '900 46px sans-serif';
      ctx.fillText(victory ? 'DUNGEON CONQUERED!' : 'YOU WERE DEFEATED', 400, 220);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText(`FINAL GOLD: ${player.gold}G | BLADE LV.${player.swordLevel}`, 400, 265);
      ctx.fillStyle = '#00f3ff';
      ctx.font = '16px sans-serif';
      ctx.fillText('Click "Restart" above to play again', 400, 305);
      ctx.textAlign = 'left';
    }


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
  };
}

function getAccountsDB() {
  try {
    return JSON.parse(localStorage.getItem('nexus_arcade_accounts') || '{}');
  } catch (e) {
    return {};
  }
}


function saveAccountsDB(db) {
  try {
    localStorage.setItem('nexus_arcade_accounts', JSON.stringify(db));
  } catch (e) {}
}


function getUserData() {
  if (!window.currentUser) return { highScores: {}, scratchSlots: {} };
  const db = getAccountsDB();
  return db[window.currentUser] || { password: '', highScores: {}, scratchSlots: {} };
}


function recordHighScore(gameId, scoreVal) {
  if (!window.currentUser || typeof scoreVal !== 'number' || isNaN(scoreVal)) return;
  const db = getAccountsDB();
  const user = db[window.currentUser];
  if (!user) return;
  if (!user.highScores) user.highScores = {};
  const prevBest = user.highScores[gameId] || 0;
  if (scoreVal > prevBest) {
    user.highScores[gameId] = scoreVal;
    saveAccountsDB(db);
  }
}

  cards.forEach((card, idx) => {

(function bindLeaderboardEvents() {
  const lbModal = document.getElementById('lb-modal');
  const openBtn = document.getElementById('btn-open-lb');
  const closeBtn = document.getElementById('btn-close-lb');
  const selectEl = document.getElementById('lb-game-select');
  const listEl = document.getElementById('lb-list');


  function populateDropdown() {
    selectEl.innerHTML = `<option value="overall">🌟 OVERALL TOTAL SCORE (ALL GAMES)</option>`;
    GAMES.forEach(g => {
      if (g.id !== 'cyber-scratch') {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = `🎮 ${g.title}`;
        selectEl.appendChild(opt);
      }
    });
  }


  function renderRankings() {
    const mode = selectEl.value;
    const db = getAccountsDB();
    const entries = new Array();


    Object.keys(db).forEach(username => {
      const hs = db[username].highScores || {};
      let score = 0;
      if (mode === 'overall') {
        Object.values(hs).forEach(val => {
          if (typeof val === 'number') score += val;
        });
      } else {
        score = hs[mode] || 0;
      }
      entries.push({ username, score });
    });


    entries.sort((a, b) => b.score - a.score);


    listEl.innerHTML = '';
    if (entries.length === 0) {
      listEl.innerHTML = `<div style="color:#8a94b8; text-align:center; padding:1.5rem;">No player accounts recorded yet!</div>`;
      return;
    }


    entries.forEach((entry, index) => {
      const rank = index + 1;
      const row = document.createElement('div');
      row.className = `lb-row ${rank <= 3 ? 'rank-' + rank : ''}`;
      const isMe = window.currentUser === entry.username ? ' (YOU)' : '';
      const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;


      row.innerHTML = `
        <div class="lb-rank">${medal}</div>
        <div class="lb-name">${entry.username}${isMe}</div>
        <div class="lb-score">${entry.score.toLocaleString()} PTS</div>
      `;
      listEl.appendChild(row);
    });
  }


  if (openBtn) {
    openBtn.addEventListener('click', () => {
      populateDropdown();
      renderRankings();
      lbModal.classList.add('active');
    });
  }


  if (closeBtn) {
    closeBtn.addEventListener('click', () => lbModal.classList.remove('active'));
  }


  if (selectEl) {
    selectEl.addEventListener('change', renderRankings);
  }


  lbModal.addEventListener('click', e => {
    if (e.target === lbModal) lbModal.classList.remove('active');
  });
})();

  function populateZone(zKey) {

        );

  function triggerClawAttack() {
    cat.attackTimer = 10;

        }
      }
    }


    // Check Enemy Combat
    for (let i = z.enemies.length - 1; i >= 0; i--) {
      let en = z.enemies[i];
      if (Math.hypot(en.x - hitX, en.y - hitY) < reach + en.r) {
        en.hp -= cat.dmg;
        en.hitFlash = 7;
        en.x += cat.dirX * 14;
        en.y += cat.dirY * 14;
        addEffects(en.x, en.y, '#00ff88', 10);

  function interactNearest() {
    const z = zones[zoneId];
    // Pick up herbs
    for (let i = z.herbs.length - 1; i >= 0; i--) {
      if (Math.hypot(cat.x - z.herbs[i].x, cat.y - z.herbs[i].y) < 42) {

    // Talk to Camp NPCs
    for (let npc of z.npcs) {
      if (Math.hypot(cat.x - npc.x, cat.y - npc.y) < 58) {

              setLog(`CLAN CEREMONY! You are now ${getFullName()} (${nextRank.name})!`);
            } else {
