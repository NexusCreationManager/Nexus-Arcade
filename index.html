const GlobalAccountSync = (function() {
  const ACC_ROOM_ID = 'nexus_arcade_global_accounts_v1';
  let peer = null;
  let isHost = false;
  let hostConn = null;
  let clientConns = new Array();


  function mergeAccountVaults(incomingDB) {
    const localDB = getAccountsDB();
    let changed = false;


    if (incomingDB && typeof incomingDB === 'object') {
      Object.keys(incomingDB).forEach(username => {
        const inc = incomingDB[username];
        if (!inc || typeof inc !== 'object' || !inc.password) return;


        if (!localDB[username]) {
          // New global account discovered -> save locally!
          localDB[username] = JSON.parse(JSON.stringify(inc));
          changed = true;
        } else {
          const loc = localDB[username];
          // Only merge progress if passwords match
          if (loc.password === inc.password) {
            // Merge High Scores (keep highest)
            if (!loc.highScores) loc.highScores = {};
            const incHS = inc.highScores || {};
            Object.keys(incHS).forEach(gid => {
              if ((incHS[gid] || 0) > (loc.highScores[gid] || 0)) {
                loc.highScores[gid] = incHS[gid];
                changed = true;
              }
            });


            // Merge Achievements (union)
            if (!Array.isArray(loc.achievements)) loc.achievements = new Array();
            (inc.achievements || new Array()).forEach(ach => {
              if (!loc.achievements.includes(ach)) {
                loc.achievements.push(ach);
                changed = true;
              }
            });


            // Merge Cyber Scratch Slots
            if (!loc.scratchSlots) loc.scratchSlots = {};
            const incSlots = inc.scratchSlots || {};
            Object.keys(incSlots).forEach(sk => {
              if (!loc.scratchSlots[sk] && incSlots[sk]) {
                loc.scratchSlots[sk] = incSlots[sk];
                changed = true;
              }
            });


            // Merge Warrior Cat customization
            if (!loc.warriorCat && inc.warriorCat) {
              loc.warriorCat = inc.warriorCat;
              changed = true;
            }


            // Merge Custom Songs (up to 10)
            if (!Array.isArray(loc.customSongs)) loc.customSongs = new Array();
            const existingNames = new Set(loc.customSongs.map(s => s.name));
            (inc.customSongs || new Array()).forEach(song => {
              if (song && song.name && !existingNames.has(song.name) && loc.customSongs.length < 10) {
                loc.customSongs.push(song);
                existingNames.add(song.name);
                changed = true;
              }
            });
          }
        }
      });
    }


    if (changed) {
      _rawSetItem.call(localStorage, 'nexus_arcade_accounts', JSON.stringify(localDB));
      if (window.currentUser && typeof renderCards === 'function') {
        const activeFilter = document.querySelector('.filter-btn.active');
        renderCards(activeFilter ? activeFilter.dataset.filter : 'all');
      }
    }
    return localDB;
  }


  function pushAccountsGlobal() {
    const payload = { type: 'acc_vault_sync', db: getAccountsDB() };
    if (isHost) {
      clientConns.forEach(c => { if (c.open) c.send(payload); });
    } else if (hostConn && hostConn.open) {
      hostConn.send(payload);
    }
  }


  function connectAccountRelay() {
    if (peer || !window.Peer) return;
    const attempt = new window.Peer(ACC_ROOM_ID);


    attempt.on('open', () => {
      peer = attempt;
      isHost = true;
      peer.on('connection', conn => {
        clientConns.push(conn);
        conn.on('open', () => {
          conn.send({ type: 'acc_vault_sync', db: getAccountsDB() });
        });
        conn.on('data', data => {
          if (data && data.type === 'acc_vault_sync') {
            const merged = mergeAccountVaults(data.db);
            clientConns.forEach(c => {
              if (c.open) c.send({ type: 'acc_vault_sync', db: merged });
            });
          }
        });
      });
    });


    attempt.on('error', err => {
      if (err.type === 'unavailable-id') {
        peer = new window.Peer();
        peer.on('open', () => {
          hostConn = peer.connect(ACC_ROOM_ID);
          hostConn.on('open', () => {
            hostConn.send({ type: 'acc_vault_sync', db: getAccountsDB() });
          });
          hostConn.on('data', data => {
            if (data && data.type === 'acc_vault_sync') {
              mergeAccountVaults(data.db);
            }
          });
        });
      }
    });
  }


  setTimeout(connectAccountRelay, 1800);


  return { mergeAccountVaults, pushAccountsGlobal };
})();

  let scoreRep = 0;
  let turnState = 'player'; // 'player' | 'busy' | 'victory' | 'defeat'
  let logLine1 = 'A challenger steps into the clearing!';
  let logLine2 = 'Choose a combat move below.';
  let slashAnim = { active: false, target: 'enemy', timer: 0, color: '#00ff88' };
  let moveBtns = new Array();


  let me = {
    name: myName, fur: myFur, eye: myEye,
    hp: 120, maxHp: 120,
    guardTurns: 0,
    pp: new Array(15, 8, 10, 5),
    maxPp: new Array(15, 8, 10, 5)
  };


  let foe = {
    name: '', fur: '#888', eye: '#ffbe0b', title: '',
    hp: 85, maxHp: 85, atk: 14, guardTurns: 0, shake: 0
  };
  me.shake = 0;


  const MOVES = new Array(
    { name: '🐾 Front-Paw Strike', sub: 'Fast claw swipe (98% Acc)', color: '#00f3ff' },
    { name: '🐆 Thunder Leap',     sub: 'Heavy pounce (82% Acc)',   color: '#ffbe0b' },
    { name: '🌫️ Shadow Crouch',    sub: 'Raise Defense + Dodge',    color: '#9d4edd' },
    { name: '🌿 Marigold Lick',    sub: 'Heal 40% Max HP',          color: '#00ff88' }
  );


  function loadStage(idx) {
    const template = GAUNTLET.at(idx) || GAUNTLET.at(0);
    foe = {
      name: template.name,
      title: template.title,
      fur: template.fur,
      eye: template.eye,
      hp: template.maxHp,
      maxHp: template.maxHp,
      atk: template.atk,
      guardTurns: 0,
      shake: 0
    };
    me.maxHp = 120 + idx * 20;
    me.hp = me.maxHp;
    me.guardTurns = 0;
    me.pp = new Array(15, 8, 10, 5);
    turnState = 'player';
    logLine1 = `Stage ${idx + 1}/5: ${foe.name} challenges you!`;

  loadStage(0);


  function triggerSlashFX(targetWho, col) {

    else me.shake = 14;
  }


  function executePlayerMove(mIdx) {

    if (me.pp.at(mIdx) <= 0) {
      logLine2 = 'No energy left for that move! Pick another.';

    }


    me.pp.splice(mIdx, 1, me.pp.at(mIdx) - 1);
    turnState = 'busy';


    if (mIdx === 0) {
      // Front-Paw Strike

        logLine2 = `Raked ${foe.name} for ${dmg} damage!`;
      } else {

      if (Math.random() < 0.82) {

        if (foe.guardTurns > 0) dmg = Math.round(dmg * 0.6);
        foe.hp = Math.max(0, foe.hp - dmg);

      logLine1 = `${me.name} applied Marigold poultice!`;
      logLine2 = `Restored +${heal} HP!`;
    }


    if (foe.guardTurns > 0) foe.guardTurns--;


    // Check if Rival Defeated
    if (foe.hp <= 0) {
      scoreRep += 100 * (stageIdx + 1);

          logLine1 = '🏆 ALL CLAN RIVALS DEFEATED!';

  function executeRivalTurn() {
    if (foe.hp <= 0 || me.hp <= 0) return;


    const roll = Math.random();
    if (foe.hp < foe.maxHp * 0.35 && roll < 0.25) {
      const heal = Math.round(foe.maxHp * 0.25);
      foe.hp = Math.min(foe.maxHp, foe.hp + heal);
      logLine1 = `${foe.name} licked their battle wounds!`;
      logLine2 = `Recovered +${heal} HP!`;
    } else if (roll < 0.22) {
      foe.guardTurns = 1;
      logLine1 = `${foe.name} flattened their ears in a defensive crouch!`;
      logLine2 = 'Next incoming attack will deal reduced damage.';
    } else {
      const isHeavy = roll > 0.72;
      const moveName = isHeavy ? 'Fury Claws' : 'Lunge Bite';
      const baseAcc = isHeavy ? 0.80 : 0.94;
      const dodgePenalty = me.guardTurns > 0 ? 0.28 : 0;


      if (Math.random() < (baseAcc - dodgePenalty)) {
        let dmg = foe.atk + (isHeavy ? 10 : 0) + Math.floor(Math.random() * 6);
        if (me.guardTurns > 0) dmg = Math.round(dmg * 0.5);
        me.hp = Math.max(0, me.hp - dmg);
        triggerSlashFX('player', '#ff007f');
        logLine1 = `${foe.name} struck with ${moveName}!`;
        logLine2 = `You took ${dmg} damage!`;
      } else {
        logLine1 = `${foe.name} lunged with ${moveName}...`;
        logLine2 = `You darted aside and dodged cleanly!`;
      }
    }


    if (me.guardTurns > 0) me.guardTurns--;


    if (me.hp <= 0) {
      turnState = 'defeat';
      logLine1 = `${me.name} collapsed from exhaustion...`;
      logLine2 = 'Click Restart above to challenge the clearing again!';
    } else {
      turnState = 'player';

  const onCanvasClick = e => {
    if (turnState !== 'player') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);


    for (let b of moveBtns) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {

      }
    }

  canvas.addEventListener('click', onCanvasClick);


  function drawArenaCat(x, y, fur, eye, facingRight, scale, isGuarding, shakeAmt) {
    ctx.save();
    const sx = shakeAmt > 0 ? (Math.random() - 0.5) * 10 : 0;
    ctx.translate(x + sx, y);
    if (!facingRight) ctx.scale(-1, 1);
    ctx.scale(scale, scale);


    // Ground Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath();

      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 44, 0, Math.PI * 2);
      ctx.stroke();
    }


    // Tail
    ctx.strokeStyle = fur;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-24, 6);
    ctx.quadraticCurveTo(-48, -18, -42, -34);
    ctx.stroke();


    // Body & Legs
    ctx.fillStyle = fur;
    ctx.beginPath();
    ctx.ellipse(-4, 6, 26, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-20, 14, 7, 14);
    ctx.fillRect(10, 14, 7, 14);


    // Head & Pointed Ears
    ctx.beginPath();
    ctx.arc(22, -6, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(14, -16); ctx.lineTo(18, -30); ctx.lineTo(25, -19);
    ctx.moveTo(22, -16); ctx.lineTo(28, -30); ctx.lineTo(32, -17);
    ctx.fill();


    // Fierce Eye
    ctx.fillStyle = eye;
    ctx.beginPath();
    ctx.arc(28, -8, 3.2, 0, Math.PI * 2);
    ctx.fill();


    ctx.restore();
  }


  function drawHpPlate(x, y, w, title, sub, hp, maxHp, barCol) {
    ctx.fillStyle = 'rgba(16, 19, 34, 0.92)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, 66, 10);
    ctx.fill();
    ctx.strokeStyle = barCol;
    ctx.lineWidth = 2;
    ctx.stroke();


    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(title, x + 12, y + 21);


    ctx.fillStyle = '#8a94b8';
    ctx.font = '11px monospace';
    ctx.fillText(sub, x + 12, y + 36);


    const ratio = Math.max(0, Math.min(1, hp / maxHp));
    ctx.fillStyle = '#07080f';
    ctx.fillRect(x + 12, y + 44, w - 24, 12);
    ctx.fillStyle = ratio > 0.3 ? barCol : '#ff007f';
    ctx.fillRect(x + 12, y + 44, (w - 24) * ratio, 12);
  }


  function loop() {
    if (me.shake > 0) me.shake--;
    if (foe.shake > 0) foe.shake--;


    // Forest Clearing Sky & Ground
    ctx.fillStyle = '#080c16';
    ctx.fillRect(0, 0, 800, 320);


    // Moonlit Clearing Floor
    ctx.fillStyle = '#0e1d16';
    ctx.fillRect(0, 210, 800, 120);
    ctx.strokeStyle = '#00ff8844';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 210); ctx.lineTo(800, 210); ctx.stroke();


    // Top Score / Stage Header (Syncs directly to Global Leaderboard!)
    ctx.fillStyle = '#ffbe0b';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`STAGE ${stageIdx + 1}/5`, 24, 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#00f3ff';
    ctx.fillText(`SCORE: ${scoreRep}`, 776, 24);
    ctx.textAlign = 'left';


    // Draw Rival Cat (Top-Right) & Player Cat (Bottom-Left)
    drawArenaCat(585, 195, foe.fur, foe.eye, false, 1.15, foe.guardTurns > 0, foe.shake);
    drawArenaCat(205, 265, me.fur, me.eye, true, 1.25, me.guardTurns > 0, me.shake);


    // Claw Slash FX
    if (slashAnim.active && slashAnim.timer > 0) {
      slashAnim.timer--;
      const cx = slashAnim.target === 'enemy' ? 585 : 205;
      const cy = slashAnim.target === 'enemy' ? 190 : 260;
      ctx.strokeStyle = slashAnim.color;
      ctx.lineWidth = 4;
      for (let s = -1; s <= 1; s++) {
        ctx.beginPath();
        ctx.moveTo(cx - 25 + s * 10, cy - 22);
        ctx.lineTo(cx + 25 + s * 10, cy + 22);
        ctx.stroke();
      }
    }


    // Status Plates
    drawHpPlate(45, 42, 275, foe.name, `${foe.title} | HP: ${foe.hp}/${foe.maxHp}`, foe.hp, foe.maxHp, '#ff007f');
    drawHpPlate(480, 232, 275, me.name, `HP: ${me.hp}/${me.maxHp}${me.guardTurns > 0 ? ' [CROUCHING]' : ''}`, me.hp, me.maxHp, '#00ff88');


    // Bottom Tactical Control Panel
    ctx.fillStyle = '#101322';
    ctx.fillRect(0, 320, 800, 180);
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 320); ctx.lineTo(800, 320); ctx.stroke();


    // Battle Log Box (Left)
    ctx.fillStyle = '#07080f';
    ctx.beginPath(); ctx.roundRect(16, 334, 340, 150, 10); ctx.fill();
    ctx.strokeStyle = '#2b3354'; ctx.stroke();


    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(logLine1, 30, 372);
    ctx.fillStyle = '#f0f4ff';
    ctx.font = '13px sans-serif';
    ctx.fillText(logLine2, 30, 402);


    // 4 Realistic Warrior Move Buttons (Right 2x2 Grid)
    moveBtns = new Array();
    MOVES.forEach((mv, idx) => {
      const col = idx % 2;
      const row = Math.floor(idx / 2);
      const bx = 372 + col * 208;
      const by = 334 + row * 78;
      const bw = 198;
      const bh = 68;
      moveBtns.push({ x: bx, y: by, w: bw, h: bh, idx });


      const disabled = turnState !== 'player' || me.pp.at(idx) <= 0;
      ctx.fillStyle = disabled ? '#131728' : '#181e36';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.fill();
      ctx.strokeStyle = disabled ? '#2b3354' : mv.color;
      ctx.lineWidth = 2;
      ctx.stroke();


      ctx.fillStyle = disabled ? '#666' : mv.color;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(mv.name, bx + 10, by + 24);


      ctx.fillStyle = disabled ? '#555' : '#8a94b8';
      ctx.font = '11px sans-serif';
      ctx.fillText(mv.sub, bx + 10, by + 42);


      ctx.fillStyle = disabled ? '#555' : '#fff';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(`ENERGY: ${me.pp.at(idx)}/${me.maxPp.at(idx)}`, bx + 10, by + 58);
    });


    animFrameId = requestAnimationFrame(loop);
  }
  loop();


  return () => {
    canvas.removeEventListener('click', onCanvasClick);
  };
}

      actorGuard: me.guardTurns,
      line1: logLine1,
      line2: logLine2,
      hitTarget: hitFoe,
      slashCol: sCol

    if (foe.hp <= 0) {
      turnState = 'ended';
      scoreRep += 250;
      logLine1 = `🏆 VICTORY! ${me.name} defeated ${foe.name}!`;
      logLine2 = '+250 Reputation awarded to your Global Leaderboard!';

    ctx.fillText(title, x + 12, y + 21);
    ctx.fillStyle = '#8a94b8'; ctx.font = '11px monospace';
    ctx.fillText(sub, x + 12, y + 36);


    const ratio = Math.max(0, Math.min(1, hp / maxHp));
    ctx.fillStyle = '#07080f'; ctx.fillRect(x + 12, y + 44, w - 24, 12);

    ctx.fillRect(x + 12, y + 44, (w - 24) * ratio, 12);

    if (me.shake > 0) me.shake--;
    if (foe.shake > 0) foe.shake--;


    ctx.fillStyle = '#080c16';
    ctx.fillRect(0, 0, 800, 320);


    ctx.fillStyle = '#0e1d16';
    ctx.fillRect(0, 210, 800, 120);
    ctx.strokeStyle = '#00ff8844';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 210); ctx.lineTo(800, 210); ctx.stroke();


    // Header Status (Syncs SCORE directly to Global Leaderboard!)
    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 14px monospace';
    const turnBanner = turnState === 'my_turn' ? '🟢 YOUR TURN' : turnState === 'opp_turn' ? '🟡 OPPONENT TURN' : 'ONLINE 1v1 PVP';
    ctx.fillText(`ROOM: ${roomCode.toUpperCase()} | ${turnBanner}`, 24, 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffbe0b';
    ctx.fillText(`SCORE: ${scoreRep}`, 776, 24);

    drawPvPCat(205, 265, me.fur, me.eye, true, 1.25, me.guardTurns > 0, me.shake);


    if (slashAnim.active && slashAnim.timer > 0) {
      slashAnim.timer--;
      const cx = slashAnim.target === 'enemy' ? 585 : 205;
      const cy = slashAnim.target === 'enemy' ? 190 : 260;
      ctx.strokeStyle = slashAnim.color;
      ctx.lineWidth = 4;
      for (let s = -1; s <= 1; s++) {
        ctx.beginPath();

      }

    drawPvPPlate(45, 42, 275, foe.name, `${foe.title} | HP: ${foe.hp}/${foe.maxHp}`, foe.hp, foe.maxHp, '#ff007f');
    drawPvPPlate(480, 232, 275, me.name, `HP: ${me.hp}/${me.maxHp}${me.guardTurns > 0 ? ' [CROUCHING]' : ''}`, me.hp, me.maxHp, '#00ff88');


    ctx.fillStyle = '#101322';
    ctx.fillRect(0, 320, 800, 180);
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 320); ctx.lineTo(800, 320); ctx.stroke();


    ctx.fillStyle = '#07080f';
    ctx.beginPath(); ctx.roundRect(16, 334, 340, 150, 10); ctx.fill();
    ctx.strokeStyle = '#2b3354'; ctx.stroke();


    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(logLine1, 30, 372);
    ctx.fillStyle = '#f0f4ff';
    ctx.font = '13px sans-serif';
    ctx.fillText(logLine2, 30, 402);


    moveBtns = new Array();
    MOVES.forEach((mv, idx) => {
      const col = idx % 2;
      const row = Math.floor(idx / 2);
      const bx = 372 + col * 208;
      const by = 334 + row * 78;
      const bw = 198;
      const bh = 68;
      moveBtns.push({ x: bx, y: by, w: bw, h: bh, idx });


      const disabled = turnState !== 'my_turn' || me.pp.at(idx) <= 0;
      ctx.fillStyle = disabled ? '#131728' : '#181e36';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.fill();
      ctx.strokeStyle = disabled ? '#2b3354' : mv.color;
      ctx.lineWidth = 2;
      ctx.stroke();


      ctx.fillStyle = disabled ? '#666' : mv.color;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(mv.name, bx + 10, by + 24);


      ctx.fillStyle = disabled ? '#555' : '#8a94b8';
      ctx.font = '11px sans-serif';
      ctx.fillText(mv.sub, bx + 10, by + 42);


      ctx.fillStyle = disabled ? '#555' : '#fff';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(`ENERGY: ${me.pp.at(idx)}/${me.maxPp.at(idx)}`, bx + 10, by + 58);
    });


    animFrameId = requestAnimationFrame(pvpLoop);
  }
  pvpLoop();


  return () => {
    canvas.removeEventListener('click', onPvPClick);
    if (localChan) localChan.close();
    if (peer) peer.destroy();
  };
}

const GlobalShoutbox = (function() {
  const CHAT_ROOM_ID = 'nexus_arcade_global_shoutbox_v1';
  const myTabId = 'sb_' + Math.random().toString(36).slice(2, 8);
  let peer = null;
  let isHost = false;
  let hostConn = null;
  let clientConns = new Array();
  let localChan = null;
  let unreadCount = 0;


  const panel = document.getElementById('sb-panel');
  const toggleBtn = document.getElementById('sb-toggle-btn');
  const closeBtn = document.getElementById('sb-close-btn');
  const msgList = document.getElementById('sb-messages');
  const form = document.getElementById('sb-form');
  const input = document.getElementById('sb-input');
  const unreadDot = document.getElementById('sb-unread-dot');


  function appendMessage(sender, text, isSystem = false) {
    if (!msgList) return;
    const div = document.createElement('div');
    div.className = isSystem ? 'sb-msg sys' : 'sb-msg';
    if (isSystem) {
      div.textContent = text;
    } else {
      const nameSpan = document.createElement('span');
      nameSpan.className = 'sb-sender';
      nameSpan.textContent = `${sender}:`;
      const textNode = document.createTextNode(' ' + text);
      div.appendChild(nameSpan);
      div.appendChild(textNode);
    }
    msgList.appendChild(div);
    msgList.scrollTop = msgList.scrollHeight;


    // Keep last 40 messages in DOM
    while (msgList.children.length > 40) {
      msgList.removeChild(msgList.firstChild);
    }


    if (!panel.classList.contains('open')) {
      unreadCount++;
      unreadDot.textContent = unreadCount;
      unreadDot.style.display = 'inline-block';
    }
  }


  function broadcastChat(pkt, skipConn = null) {
    if (isHost) {
      clientConns.forEach(c => {
        if (c !== skipConn && c.open) c.send(pkt);
      });
    } else if (hostConn && hostConn.open) {
      hostConn.send(pkt);
    }
    if (localChan && !skipConn) {
      localChan.postMessage(pkt);
    }
  }


  function handleIncoming(pkt, fromConn = null) {
    if (!pkt || pkt.type !== 'sb_msg' || pkt.origin === myTabId) return;
    appendMessage(pkt.sender, pkt.text, pkt.isSystem);
    if (isHost) {
      broadcastChat(pkt, fromConn);
    }
  }


  function sendUserChat(rawText, isSystem = false) {
    const clean = rawText.trim();
    if (!clean) return;
    const senderName = window.currentUser || 'Guest';
    appendMessage(senderName, clean, isSystem);
    const pkt = {
      type: 'sb_msg',
      origin: myTabId,
      sender: senderName,
      text: clean,
      isSystem: isSystem
    };
    broadcastChat(pkt, null);
  }


  // Toggle Drawer

    panel.classList.toggle('open');

      unreadCount = 0;

      input.focus();

    panel.classList.remove('open');

    sendUserChat(input.value, false);
    input.value = '';
  });

    localChan = new BroadcastChannel('nexus_global_sb_chan');

  }

    attempt.on('open', () => {
      peer = attempt;

      peer.on('connection', conn => {

(function bindPlayerProfileSystem() {
  const AVATARS = new Array('🐱', '🔥', '👑', '⚔️', '🏎️', '♟️', '💻', '🎮', '🐉', '⚡', '🦊', '👾');
  const pModal = document.getElementById('profile-modal');
  const closeBtn = document.getElementById('btn-close-profile');
  const editSection = document.getElementById('prof-edit-section');
  const avGrid = document.getElementById('prof-avatar-grid');
  const bioInput = document.getElementById('prof-bio-input');
  const saveBtn = document.getElementById('prof-save-btn');


  let pickedAvatar = '🐱';


  function getProfileSummary(username) {
    const localDB = getAccountsDB();
    const globalCache = (typeof GlobalLeaderboard !== 'undefined' && GlobalLeaderboard.mergeRecords)
      ? GlobalLeaderboard.mergeRecords(null)
      : {};


    const locUser = localDB[username] || {};
    const globUser = globalCache[username] || {};
    const hs = locUser.highScores || globUser.highScores || {};


    let totalPts = 0;
    let gamesPlayed = 0;
    Object.values(hs).forEach(v => {
      if (typeof v === 'number' && v > 0) {
        totalPts += v;
        gamesPlayed++;
      }
    });


    const trophyCount = Array.isArray(locUser.achievements)
      ? locUser.achievements.length
      : (globUser.trophies || 0);


    return {
      username,
      avatar: locUser.avatar || globUser.avatar || '🐱',
      bio: locUser.bio || globUser.bio || 'Exploring Nexus Arcade!',
      totalPts,
      trophyCount,
      gamesPlayed
    };
  }


  function renderAvatarOptions() {
    avGrid.innerHTML = '';
    AVATARS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `av-opt ${pickedAvatar === emoji ? 'selected' : ''}`;
      btn.textContent = emoji;
      btn.onclick = () => {
        pickedAvatar = emoji;
        document.getElementById('prof-avatar-view').textContent = emoji;
        renderAvatarOptions();
      };
      avGrid.appendChild(btn);
    });
  }


  window.openPlayerProfile = function(targetUsername) {
    if (!targetUsername) return;
    const info = getProfileSummary(targetUsername);
    const isSelf = window.currentUser === targetUsername;


    document.getElementById('prof-avatar-view').textContent = info.avatar;
    document.getElementById('prof-name-view').textContent = info.username;
    document.getElementById('prof-title-view').textContent = info.trophyCount >= 5
      ? '⭐ ELITE ARCADE LEGEND'
      : info.totalPts >= 500 ? '🔥 VETERAN CHALLENGER' : '🐾 NEXUS PLAYER';
    document.getElementById('prof-bio-view').textContent = `"${info.bio}"`;
    document.getElementById('prof-pts-view').textContent = info.totalPts.toLocaleString();
    document.getElementById('prof-trophies-view').textContent = `${info.trophyCount}`;
    document.getElementById('prof-games-view').textContent = `${info.gamesPlayed}`;


    if (isSelf) {
      editSection.style.display = 'block';
      pickedAvatar = info.avatar;
      bioInput.value = info.bio;
      renderAvatarOptions();
    } else {
      editSection.style.display = 'none';
    }


    pModal.classList.add('active');
  };


  saveBtn.onclick = () => {
    if (!window.currentUser) return;
    const db = getAccountsDB();
    if (db[window.currentUser]) {
      const newBio = bioInput.value.trim() || 'Exploring Nexus Arcade!';
      db[window.currentUser].avatar = pickedAvatar;
      db[window.currentUser].bio = newBio;
      saveAccountsDB(db);


      // Update header badge with chosen avatar
      const badge = document.getElementById('active-user-label');
      if (badge) badge.textContent = `${pickedAvatar} ${window.currentUser.toUpperCase()}`;


      document.getElementById('prof-bio-view').textContent = `"${newBio}"`;
      pModal.classList.remove('active');
    }
  };


  // Update header badge with saved avatar upon login
  function syncHeaderAvatar() {
    const badge = document.getElementById('active-user-label');
    if (badge && window.currentUser) {
      const info = getProfileSummary(window.currentUser);
      badge.textContent = `${info.avatar} ${window.currentUser.toUpperCase()}`;
      badge.title = 'Click to view & edit your Player Profile';
    }
  }


  const badgeEl = document.getElementById('active-user-label');
  if (badgeEl) {
    badgeEl.addEventListener('click', () => {
      if (window.currentUser) window.openPlayerProfile(window.currentUser);
    });
  }


  const loginBtn = document.getElementById('btn-login');
  const signupBtn = document.getElementById('btn-signup');
  if (loginBtn) loginBtn.addEventListener('click', () => setTimeout(syncHeaderAvatar, 80));
  if (signupBtn) signupBtn.addEventListener('click', () => setTimeout(syncHeaderAvatar, 80));


  // Allow clicking any player row in the Global Leaderboard to inspect their Profile Card!
  const lbList = document.getElementById('lb-list');
  if (lbList) {
    lbList.addEventListener('click', e => {
      const row = e.target.closest('.lb-row');
      if (!row) return;
      const nameEl = row.querySelector('.lb-name');
      if (!nameEl) return;
      const rawText = nameEl.textContent.replace(' (YOU)', '').replace(/🎖️\d+/g, '').trim();
      if (rawText) window.openPlayerProfile(rawText);
    });
  }


  closeBtn.onclick = () => pModal.classList.remove('active');
  pModal.addEventListener('click', e => {
    if (e.target === pModal) pModal.classList.remove('active');
  });
})();

    ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 14px monospace';
    ctx.fillText(`ROOM: ${roomName.toUpperCase()}`, 35, 28);

    ctx.fillStyle = '#8a94b8'; ctx.font = '12px monospace';
    ctx.fillText(' Purr  Hiss  Stalk  StarClan', 485, 28);


    if (connected && chatHistory.length > 0) {
      ctx.fillStyle = 'rgba(7, 8, 15, 0.72)';
      ctx.fillRect(38, 325, 360, 96);
      chatHistory.forEach((m, i) => {

      });
    }

    Object.values(voiceCalls).forEach(c => c.close());
    Object.values(audioEls).forEach(a => a.remove());
    window.removeEventListener('keydown', onKD);
    window.removeEventListener('keyup', onKU);
    if (localChan) localChan.close();
    if (peer) peer.destroy();
    uiLayer.remove();
  };
}

(function bindCrossOSSyncLogic() {
  const modal = document.getElementById('os-sync-modal');
  const syncBtn = document.getElementById('btn-os-sync');
  const statusEl = document.getElementById('oss-status');
  if (!modal || !syncBtn) return;


  const OS_GUIDES = {
    windows: '🪟 Windows: Share via Quick Share, Google Drive, USB, or copy-paste the code into Chrome/Edge!',
    android: '📱 Android: Send the .JSON file via Quick Share / Nearby Share, or paste the Sync Code in mobile Chrome!',
    chromeos: '💻 ChromeOS: Drop the .JSON file into Google Drive or Files, or paste the Sync Code directly!',
    macos: '🍏 macOS / iOS: Send via AirDrop or iCloud Drive, then load on the other device!'
  };


  function buildFullExportBundle() {
    return {
      v: 1,
      ts: Date.now(),
      accounts: typeof getAccountsDB === 'function' ? getAccountsDB() : {},
      leaderboard: (typeof GlobalLeaderboard !== 'undefined' && GlobalLeaderboard.mergeRecords)
        ? GlobalLeaderboard.mergeRecords(null) : {},
      worlds: JSON.parse(localStorage.getItem('nexusblox_v2_worlds') || '[]')
    };
  }


  function mergeIncomingBundle(bundle) {
    if (!bundle || typeof bundle !== 'object') return false;


    // 1. Merge Accounts (keeps highest scores, merges trophies, avatars, bios, custom songs)
    if (bundle.accounts && typeof getAccountsDB === 'function') {
      const localDB = getAccountsDB();
      Object.keys(bundle.accounts).forEach(uname => {
        const inc = bundle.accounts[uname];
        if (!inc || !inc.password) return;
        if (!localDB[uname]) {
          localDB[uname] = JSON.parse(JSON.stringify(inc));
        } else if (localDB[uname].password === inc.password) {
          const loc = localDB[uname];
          if (!loc.highScores) loc.highScores = {};
          Object.keys(inc.highScores || {}).forEach(g => {
            if ((inc.highScores[g] || 0) > (loc.highScores[g] || 0)) loc.highScores[g] = inc.highScores[g];
          });
          if (!Array.isArray(loc.achievements)) loc.achievements = [];
          (inc.achievements || []).forEach(a => {
            if (!loc.achievements.includes(a)) loc.achievements.push(a);
          });
          if (inc.avatar && !loc.avatar) loc.avatar = inc.avatar;
          if (inc.bio && !loc.bio) loc.bio = inc.bio;
        }
      });
      localStorage.setItem('nexus_arcade_accounts', JSON.stringify(localDB));
    }


    // 2. Merge Global Leaderboard
    if (bundle.leaderboard && typeof GlobalLeaderboard !== 'undefined' && GlobalLeaderboard.mergeRecords) {
      GlobalLeaderboard.mergeRecords(bundle.leaderboard);
    }


    // 3. Merge NexusBlox Worlds
    if (Array.isArray(bundle.worlds) && typeof NexusBloxEngine !== 'undefined' && NexusBloxEngine.mergeCatalog) {
      NexusBloxEngine.mergeCatalog(bundle.worlds);
    }


    return true;
  }


  function refreshExportCode() {
    const jsonStr = JSON.stringify(buildFullExportBundle());
    const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
    document.getElementById('oss-export-box').value = encoded;
  }


  document.getElementById('oss-target-os').onchange = e => {
    document.getElementById('oss-os-hint').textContent = OS_GUIDES[e.target.value] || '';
  };


  document.getElementById('oss-copy-code').onclick = () => {
    const box = document.getElementById('oss-export-box');
    box.select();
    if (navigator.clipboard) navigator.clipboard.writeText(box.value);
    statusEl.textContent = '📋 Sync Code copied! Paste it into Receive Data on your other device.';
  };


  document.getElementById('oss-dl-file').onclick = () => {
    const jsonStr = JSON.stringify(buildFullExportBundle(), null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nexus_arcade_sync.json';
    a.click();
    URL.revokeObjectURL(url);
    statusEl.textContent = '⬇️ Downloaded nexus_arcade_sync.json! Send this file to any OS.';
  };


  document.getElementById('oss-apply-code').onclick = () => {
    try {
      const raw = document.getElementById('oss-import-box').value.trim();
      const jsonStr = decodeURIComponent(escape(atob(raw)));
      const parsed = JSON.parse(jsonStr);
      if (mergeIncomingBundle(parsed)) {
        statusEl.textContent = '✅ Synced Accounts, Trophies, Worlds & Leaderboard!';
        document.getElementById('oss-import-box').value = '';
      }
    } catch (e) {
      statusEl.textContent = '⚠️ Invalid Sync Code! Make sure you copied the whole code.';
    }
  };


  document.getElementById('oss-upload-file').onchange = e => {
    const file = e.target.files && e.target.files.item(0);
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (mergeIncomingBundle(parsed)) {
          statusEl.textContent = `✅ Loaded "${file.name}"! All data merged across OS.`;
        }
      } catch (err) {
        statusEl.textContent = '⚠️ Could not read .JSON file!';
      }
    };
    reader.readAsText(file);
  };


  // Live P2P WebRTC Handshake
  let p2pConn = null;
  let p2pChan = null;
  const p2pBox = document.getElementById('oss-p2p-box');


  function wireP2P(ch) {
    p2pChan = ch;
    ch.onopen = () => {
      syncBtn.textContent = '🟢 OS Linked';
      statusEl.textContent = '⚡ LIVE LINK CONNECTED! Syncing data automatically...';
      ch.send(JSON.stringify(buildFullExportBundle()));
    };
    ch.onmessage = ev => {
      try {
        mergeIncomingBundle(JSON.parse(ev.data));
        statusEl.textContent = '⚡ Live sync received from linked device!';
      } catch (e) {}
    };
  }


  document.getElementById('oss-p2p-offer').onclick = async () => {
    p2pConn = new RTCPeerConnection({ iceServers: [{ urls: 'stun:://google.com' }] });
    wireP2P(p2pConn.createDataChannel('nx_os_p2p'));
    const off = await p2pConn.createOffer();
    await p2pConn.setLocalDescription(off);
    await new Promise(r => setTimeout(r, 700));
    p2pBox.value = btoa(JSON.stringify(p2pConn.localDescription));
    statusEl.textContent = '📋 Copy this Host Code to your 2nd device!';
  };


  document.getElementById('oss-p2p-answer').onclick = async () => {
    try {
      const off = JSON.parse(atob(p2pBox.value.trim()));
      p2pConn = new RTCPeerConnection({ iceServers: [{ urls: 'stun:://google.com' }] });
      p2pConn.ondatachannel = ev => wireP2P(ev.channel);
      await p2pConn.setRemoteDescription(off);
      const ans = await p2pConn.createAnswer();
      await p2pConn.setLocalDescription(ans);
      await new Promise(r => setTimeout(r, 700));
      p2pBox.value = btoa(JSON.stringify(p2pConn.localDescription));
      statusEl.textContent = '📋 Copy this Answer Code back to Host!';
    } catch (e) { statusEl.textContent = '⚠️ Paste Host Code first!'; }
  };


  document.getElementById('oss-p2p-finish').onclick = async () => {
    try {
      if (!p2pConn) return;
      await p2pConn.setRemoteDescription(JSON.parse(atob(p2pBox.value.trim())));
      statusEl.textContent = '⏳ Linking devices...';
    } catch (e) { statusEl.textContent = '⚠️ Paste Answer Code first!'; }
  };


  // Tab Switching
  function showTab(tab) {
    document.getElementById('oss-view-send').style.display = tab === 'send' ? 'flex' : 'none';
    document.getElementById('oss-view-recv').style.display = tab === 'recv' ? 'flex' : 'none';
    document.getElementById('oss-view-p2p').style.display = tab === 'p2p' ? 'flex' : 'none';
    if (tab === 'send') refreshExportCode();
  }


  document.getElementById('oss-tab-send').onclick = () => showTab('send');
  document.getElementById('oss-tab-recv').onclick = () => showTab('recv');
  document.getElementById('oss-tab-p2p').onclick = () => showTab('p2p');


  syncBtn.onclick = () => {
    refreshExportCode();
    modal.style.display = 'flex';
  };
  document.getElementById('oss-close').onclick = () => { modal.style.display = 'none'; };
})();
</script>

<script>
/* ==========================================================================
   MODULE 62: CONNECT ALL ONLINE GAMES TO WORKING MQTT BUS + FIX CROSS-OS MODAL
   ========================================================================== */
(function connectGamesToWorkingMQTT() {
  const STUN_SERVERS = {
    iceServers: [
      { urls: 'stun:://google.com' },
      { urls: 'stun:://google.com' }
    ]
  };


  const peerSignalListeners = new Set();


  // Receive WebRTC signaling packets routed over Module 59's working MQTT bus
  window._onGlobalPeerSig = function(sigPkt) {
    if (!sigPkt) return;
    peerSignalListeners.forEach(fn => fn(sigPkt));
  };


  class MqttDataConnection {
    constructor(localPeer, remotePeerId, isInitiator) {
      this.peer = remotePeerId;
      this.open = false;
      this._ev = {};
      this._pc = new RTCPeerConnection(STUN_SERVERS);
      this._dc = null;
      this._lp = localPeer;


      this._pc.onicecandidate = e => {
        if (e.candidate && window.nexusGlobalBroadcast) {
          window.nexusGlobalBroadcast('peer_sig', {
            to: this.peer, from: this._lp.id, kind: 'ice', candidate: e.candidate
          });
        }
      };


      if (isInitiator) {
        this._dc = this._pc.createDataChannel('nx_mqtt_dc', { ordered: true });
        this._bindChannel(this._dc);
        this._pc.createOffer()
          .then(offer => this._pc.setLocalDescription(offer))
          .then(() => {
            if (window.nexusGlobalBroadcast) {
              window.nexusGlobalBroadcast('peer_sig', {
                to: this.peer, from: this._lp.id, kind: 'offer', sdp: this._pc.localDescription
              });
            }
          }).catch(() => {});
      } else {
        this._pc.ondatachannel = ev => {
          this._dc = ev.channel;
          this._bindChannel(this._dc);
        };
      }
    }


    _bindChannel(dc) {
      dc.onopen = () => { this.open = true; this._emit('open'); };
      dc.onclose = () => { this.open = false; this._emit('close'); };
      dc.onmessage = ev => {
        try { this._emit('data', JSON.parse(ev.data)); }
        catch (e) { this._emit('data', ev.data); }
      };
    }


    send(payload) {
      if (this._dc && this._dc.readyState === 'open') {
        try { this._dc.send(typeof payload === 'string' ? payload : JSON.stringify(payload)); } catch (e) {}
      }
    }


    close() {
      this.open = false;
      try { if (this._dc) this._dc.close(); } catch (e) {}
      try { if (this._pc) this._pc.close(); } catch (e) {}
      this._emit('close');
    }


    on(evt, fn) { (this._ev[evt] = this._ev[evt] || []).push(fn); }
    _emit(evt, val) { (this._ev[evt] || []).forEach(fn => fn(val)); }
  }


  window.Peer = class MqttPeer {
    constructor(customId) {
      this.id = (typeof customId === 'string' && customId.trim())
        ? customId.trim()
        : ('nxm_' + Math.random().toString(36).slice(2, 10));
      this._ev = {};
      this._conns = {};
      this.connections = {};
      this._dead = false;


      this._sigHandler = pkt => {
        if (this._dead || !pkt || pkt.to !== this.id) return;


        if (pkt.kind === 'ping' && window.nexusGlobalBroadcast) {
          window.nexusGlobalBroadcast('peer_sig', { to: pkt.from, from: this.id, kind: 'pong' });
        } else if (pkt.kind === 'offer') {
          const conn = new MqttDataConnection(this, pkt.from, false);
          this._conns[pkt.from] = conn;
          this.connections[pkt.from] = [conn];
          conn._pc.setRemoteDescription(new RTCSessionDescription(pkt.sdp))
            .then(() => conn._pc.createAnswer())
            .then(ans => conn._pc.setLocalDescription(ans))
            .then(() => {
              if (window.nexusGlobalBroadcast) {
                window.nexusGlobalBroadcast('peer_sig', {
                  to: pkt.from, from: this.id, kind: 'answer', sdp: conn._pc.localDescription
                });
              }
              this._emit('connection', conn);
            }).catch(() => {});
        } else if (pkt.kind === 'answer') {
          const conn = this._conns[pkt.from];
          if (conn && conn._pc) conn._pc.setRemoteDescription(new RTCSessionDescription(pkt.sdp)).catch(() => {});
        } else if (pkt.kind === 'ice') {
          const conn = this._conns[pkt.from];
          if (conn && conn._pc && pkt.candidate) conn._pc.addIceCandidate(new RTCIceCandidate(pkt.candidate)).catch(() => {});
        }
      };


      peerSignalListeners.add(this._sigHandler);


      if (typeof customId === 'string' && customId.trim()) {
        let taken = false;
        const probeId = 'prb_' + Math.random().toString(36).slice(2, 8);
        const checkPong = pkt => {
          if (pkt && pkt.to === probeId && pkt.from === this.id && pkt.kind === 'pong') taken = true;
        };
        peerSignalListeners.add(checkPong);
        setTimeout(() => {
          if (window.nexusGlobalBroadcast) {
            window.nexusGlobalBroadcast('peer_sig', { to: this.id, from: probeId, kind: 'ping' });
          }
        }, 200);


        setTimeout(() => {
          peerSignalListeners.delete(checkPong);
          if (this._dead) return;
          if (taken) this._emit('error', { type: 'unavailable-id' });
          else this._emit('open', this.id);
        }, 1200);
      } else {
        setTimeout(() => { if (!this._dead) this._emit('open', this.id); }, 300);
      }
    }


    connect(targetId) {
      const conn = new MqttDataConnection(this, targetId, true);
      this._conns[targetId] = conn;
      this.connections[targetId] = [conn];
      return conn;
    }


    destroy() {
      this._dead = true;
      peerSignalListeners.delete(this._sigHandler);
      Object.values(this._conns).forEach(c => c.close());
    }


    on(evt, fn) { (this._ev[evt] = this._ev[evt] || []).push(fn); }
    _emit(evt, val) { (this._ev[evt] || []).forEach(fn => fn(val)); }
  };
})();

        <textarea id="oss62-out" rows="3" readonly style="width:100%; padding:0.6rem; border-radius:8px; border:1px solid #00f3ff; background:#07080f; color:#00ff88; font-family:monospace; font-size:0.74rem; user-select:text;"></textarea>
        <div style="display:flex; gap:0.5rem;">
          <button id="oss62-copy" style="flex:1; padding:0.65rem; border:none; border-radius:8px; background:#00f3ff; color:#000; font-weight:900; cursor:pointer;">📋 Copy Code</button>
          <button id="oss62-dl" style="flex:1; padding:0.65rem; border:none; border-radius:8px; background:#00ff88; color:#000; font-weight:900; cursor:pointer;">⬇️ Save .JSON</button>
        </div>
      </div>


      <div id="oss62-recv-pane" style="display:none; flex-direction:column; gap:0.7rem;">
        <textarea id="oss62-in" rows="3" placeholder="Paste Sync Code from Windows, Android, ChromeOS, or macOS..." style="width:100%; padding:0.6rem; border-radius:8px; border:1px solid #ffbe0b; background:#07080f; color:#fff; font-family:monospace; font-size:0.74rem; user-select:text;"></textarea>
        <div style="display:flex; gap:0.5rem;">
          <button id="oss62-apply" style="flex:1; padding:0.65rem; border:none; border-radius:8px; background:#ffbe0b; color:#000; font-weight:900; cursor:pointer;">✅ Merge Sync Code</button>
          <label style="flex:1; padding:0.65rem; border-radius:8px; background:#9d4edd; color:#fff; font-weight:900; cursor:pointer; text-align:center;">
            📂 Load .JSON
            <input id="oss62-file" type="file" accept=".json,application/json" style="display:none;" />
          </label>
        </div>
      </div>


      <div id="oss62-msg" style="margin-top:0.8rem; color:#00ff88; font-family:monospace; font-size:0.82rem; text-align:center;">Ready!</div>
    </div>
  `;
  document.body.appendChild(modal);


  const tips = {
    win: '🪟 Windows: Copy the Sync Code or save the .JSON file and open it on your other PC!',
    and: '📱 Android: Send the .JSON file via Quick Share / Nearby Share or paste the Sync Code in mobile Chrome!',
    cro: '💻 ChromeOS: Drop the .JSON file into Google Drive or Files and load it on your Chromebook!',
    mac: '🍏 macOS / iOS: Send via AirDrop or iCloud Drive and load it on the other device!'
  };


  function getBundle() {
    return {
      accounts: typeof getAccountsDB === 'function' ? getAccountsDB() : {},
      leaderboard: (typeof GlobalLeaderboard !== 'undefined' && GlobalLeaderboard.mergeRecords)
        ? GlobalLeaderboard.mergeRecords(null) : {},
      worlds: JSON.parse(localStorage.getItem('nexusblox_v2_worlds') || '[]')
    };
  }


  function applyBundle(b) {
    if (!b || typeof b !== 'object') return false;
    if (b.accounts && typeof getAccountsDB === 'function') {
      const loc = getAccountsDB();
      Object.keys(b.accounts).forEach(u => {
        if (!loc[u]) loc[u] = b.accounts[u];
        else if (loc[u].password === b.accounts[u].password) {
          Object.assign(loc[u].highScores || (loc[u].highScores = {}), b.accounts[u].highScores || {});
        }
      });
      localStorage.setItem('nexus_arcade_accounts', JSON.stringify(loc));
    }
    if (b.leaderboard && typeof GlobalLeaderboard !== 'undefined' && GlobalLeaderboard.mergeRecords) {
      GlobalLeaderboard.mergeRecords(b.leaderboard);
    }
    if (Array.isArray(b.worlds) && typeof NexusBloxEngine !== 'undefined' && NexusBloxEngine.mergeCatalog) {
      NexusBloxEngine.mergeCatalog(b.worlds);
    }
    if (window.syncGlobalVaultsNow) window.syncGlobalVaultsNow();
    return true;
  }


  const msg = document.getElementById('oss62-msg');
  document.getElementById('oss62-os-pick').onchange = e => {
    document.getElementById('oss62-tip').textContent = tips[e.target.value] || '';
  };


  document.getElementById('oss62-copy').onclick = () => {
    const out = document.getElementById('oss62-out');
    out.select();
    if (navigator.clipboard) navigator.clipboard.writeText(out.value);
    msg.textContent = '📋 Sync Code copied!';
  };


  document.getElementById('oss62-dl').onclick = () => {
    const blob = new Blob([JSON.stringify(getBundle(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'nexus_arcade_sync.json'; a.click();
    URL.revokeObjectURL(url);
    msg.textContent = '⬇️ Downloaded nexus_arcade_sync.json!';
  };


  document.getElementById('oss62-apply').onclick = () => {
    try {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('oss62-in').value.trim()))));
      if (applyBundle(parsed)) {
        msg.textContent = '✅ Merged Accounts, Worlds & Leaderboard!';
        document.getElementById('oss62-in').value = '';
      }
    } catch (e) { msg.textContent = '⚠️ Invalid Sync Code!'; }
  };


  document.getElementById('oss62-file').onchange = e => {
    const f = e.target.files && e.target.files.item(0);
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        if (applyBundle(JSON.parse(r.result))) msg.textContent = `✅ Loaded ${f.name}!`;
      } catch (err) { msg.textContent = '⚠️ Invalid .JSON file!'; }
    };
    r.readAsText(f);
  };


  document.getElementById('oss62-tab-send').onclick = () => {
    document.getElementById('oss62-send-pane').style.display = 'flex';
    document.getElementById('oss62-recv-pane').style.display = 'none';
    document.getElementById('oss62-out').value = btoa(unescape(encodeURIComponent(JSON.stringify(getBundle()))));
  };


  document.getElementById('oss62-tab-recv').onclick = () => {
    document.getElementById('oss62-send-pane').style.display = 'none';
    document.getElementById('oss62-recv-pane').style.display = 'flex';
  };


  document.getElementById('oss62-close').onclick = () => { modal.style.display = 'none'; };


  // Re-bind the top-left Cross-OS Sync button to open this modal cleanly
  const btn = document.getElementById('btn-os-sync');
  if (btn) {
    btn.onclick = () => {
      document.getElementById('oss62-out').value = btoa(unescape(encodeURIComponent(JSON.stringify(getBundle()))));
      modal.style.display = 'flex';
    };
  }
})();
</script>
<script>
/* ==========================================================================
   MODULE 63: DIRECT MQTT-BACKED MULTIPLAYER ENGINE (100% GUARANTEED SYNC)
   ========================================================================== */
(function installDirectMqttMultiplayer() {
  const peerInbox = new Set();


  // Receive direct multiplayer packets from Module 59's working MQTT bus
  window._onGlobalPeerSig = function(pkt) {
    if (!pkt) return;
    peerInbox.forEach(fn => fn(pkt));
  };


  class DirectMqttConn {
    constructor(localPeer, remoteId, connId) {
      this.peer = remoteId;
      this.connId = connId || ('c_' + Math.random().toString(36).slice(2, 9));
      this.open = false;
      this._ev = {};
      this._lp = localPeer;
    }


    send(payload) {
      if (!this.open || !window.nexusGlobalBroadcast) return;
      window.nexusGlobalBroadcast('peer_sig', {
        kind: 'dc_data',
        to: this.peer,
        from: this._lp.id,
        connId: this.connId,
        payload: payload
      });
    }


    close() {
      if (!this.open) return;
      this.open = false;
      if (window.nexusGlobalBroadcast) {
        window.nexusGlobalBroadcast('peer_sig', {
          kind: 'dc_close',
          to: this.peer,
          from: this._lp.id,
          connId: this.connId
        });
      }
      this._fire('close');
    }


    on(evt, fn) { (this._ev[evt] = this._ev[evt] || []).push(fn); }
    _fire(evt, arg) { (this._ev[evt] || []).forEach(fn => fn(arg)); }
  }


  window.Peer = class DirectMqttPeer {
    constructor(customId) {
      this.id = (typeof customId === 'string' && customId.trim())
        ? customId.trim()
        : ('nx63_' + Math.random().toString(36).slice(2, 10));
      this._ev = {};
      this._conns = {};
      this.connections = {};
      this._dead = false;


      this._handler = pkt => {
        if (this._dead || !pkt || pkt.to !== this.id) return;


        if (pkt.kind === 'ping' && window.nexusGlobalBroadcast) {
          window.nexusGlobalBroadcast('peer_sig', { kind: 'pong', to: pkt.from, from: this.id });
        } else if (pkt.kind === 'dc_open') {
          const conn = new DirectMqttConn(this, pkt.from, pkt.connId);
          conn.open = true;
          this._conns[pkt.connId] = conn;
          this.connections[pkt.from] = [conn];
          if (window.nexusGlobalBroadcast) {
            window.nexusGlobalBroadcast('peer_sig', {
              kind: 'dc_ack', to: pkt.from, from: this.id, connId: pkt.connId
            });
          }
          this._fire('connection', conn);
          setTimeout(() => conn._fire('open'), 50);
        } else if (pkt.kind === 'dc_ack') {
          const conn = this._conns[pkt.connId];
          if (conn && !conn.open) {
            conn.open = true;
            conn._fire('open');
          }
        } else if (pkt.kind === 'dc_data') {
          const conn = this._conns[pkt.connId];
          if (conn) conn._fire('data', pkt.payload);
        } else if (pkt.kind === 'dc_close') {
          const conn = this._conns[pkt.connId];
          if (conn) {
            conn.open = false;
            conn._fire('close');
          }
        }
      };


      peerInbox.add(this._handler);


      if (typeof customId === 'string' && customId.trim()) {
        let taken = false;
        const probeId = 'prb_' + Math.random().toString(36).slice(2, 8);
        const onPong = pkt => {
          if (pkt && pkt.to === probeId && pkt.from === this.id && pkt.kind === 'pong') taken = true;
        };
        peerInbox.add(onPong);
        setTimeout(() => {
          if (window.nexusGlobalBroadcast) {
            window.nexusGlobalBroadcast('peer_sig', { kind: 'ping', to: this.id, from: probeId });
          }
        }, 150);


        setTimeout(() => {
          peerInbox.delete(onPong);
          if (this._dead) return;
          if (taken) this._fire('error', { type: 'unavailable-id' });
          else this._fire('open', this.id);
        }, 1000);
      } else {
        setTimeout(() => { if (!this._dead) this._fire('open', this.id); }, 250);
      }
    }


    connect(targetId) {
      const conn = new DirectMqttConn(this, targetId);
      this._conns[conn.connId] = conn;
      this.connections[targetId] = [conn];
      setTimeout(() => {
        if (window.nexusGlobalBroadcast) {
          window.nexusGlobalBroadcast('peer_sig', {
            kind: 'dc_open', to: targetId, from: this.id, connId: conn.connId
          });
        }
      }, 200);
      return conn;
    }


    destroy() {
      this._dead = true;
      peerInbox.delete(this._handler);
      Object.values(this._conns).forEach(c => c.close());
    }


    on(evt, fn) { (this._ev[evt] = this._ev[evt] || []).push(fn); }
    _fire(evt, arg) { (this._ev[evt] || []).forEach(fn => fn(arg)); }
  };
})();
</script>
<script>
/* ==========================================================================
   MODULE 64: CROSS-PC WALKIE-TALKIE VOICE OVER WORKING MQTT BUS
   ========================================================================== */
(function bridgeVoiceOverMqtt() {
  const myVoiceSenderId = 'vc64_' + Math.random().toString(36).slice(2, 9);
  let spkCtx = null;
  let playHead = 0;
  let heardCrossPC = 0;
  let sentCrossPC = 0;


  function getSpkCtx() {
    if (!spkCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      spkCtx = new Ctx();
    }
    if (spkCtx.state === 'suspended') spkCtx.resume();
    return spkCtx;
  }


  document.addEventListener('click', getSpkCtx);


  function playMqttVoiceChunk(b64, rate) {
    try {
      const ctx = getSpkCtx();
      const raw = atob(b64);
      const u8 = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
      const i16 = new Int16Array(u8.buffer);
      if (i16.length === 0) return;


      const audioBuf = ctx.createBuffer(1, i16.length, rate || 16000);
      const f32 = audioBuf.getChannelData(0);
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;


      const src = ctx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(ctx.destination);


      const now = ctx.currentTime;
      if (playHead < now) playHead = now + 0.03;
      src.start(playHead);
      playHead += audioBuf.duration;
      heardCrossPC++;
    } catch (e) {}
  }


  // 1. Intercept Module 48's outgoing BroadcastChannel voice packets & forward them to the other PC via MQTT!
  const prevPost64 = BroadcastChannel.prototype.postMessage;
  BroadcastChannel.prototype.postMessage = function(msg) {
    if (msg && msg._vc48 && window.nexusGlobalBroadcast) {
      sentCrossPC++;
      window.nexusGlobalBroadcast('voice_relay', {
        sender: myVoiceSenderId,
        b64: msg._vc48,
        sr: msg._sr || 16000
      });
    }
    return prevPost64.call(this, msg);
  };


  // 2. Listen for incoming 'voice_relay' packets from the other PC on Module 59's MQTT bus
  const prevPeerSig64 = window._onGlobalPeerSig;
  window._onGlobalPeerSig = function(pkt) {
    if (pkt && pkt.kind === 'mqtt_voice_pkt' && pkt.sender !== myVoiceSenderId) {
      if (activeGameId === 'warrior-online') {
        playMqttVoiceChunk(pkt.b64, pkt.sr);
      }
      return;
    }
    if (prevPeerSig64) prevPeerSig64(pkt);
  };


  // Wrap nexusGlobalBroadcast so 'voice_relay' travels as a 'peer_sig' packet (already handled by Module 59!)
  const origBroadcast64 = window.nexusGlobalBroadcast;
  if (origBroadcast64 && !window.nexusGlobalBroadcast._wrapped64) {
    window.nexusGlobalBroadcast = function(ch, dataObj) {
      if (ch === 'voice_relay') {
        return origBroadcast64('peer_sig', {
          kind: 'mqtt_voice_pkt',
          sender: dataObj.sender,
          b64: dataObj.b64,
          sr: dataObj.sr
        });
      }
      return origBroadcast64(ch, dataObj);
    };
    window.nexusGlobalBroadcast._wrapped64 = true;
  }


  // 3. Keep the live Sent / Heard counter updated in the chat bar so Module 51's 🎙️ nameplate icon lights up too!
  setInterval(() => {
    if (activeGameId !== 'warrior-online') return;
    const inp = document.getElementById('cwc-input');
    const btn = document.getElementById('cwc-mic');
    if (!inp || !btn) return;
    const isLive = btn.textContent.includes('LIVE');
    if (isLive || heardCrossPC > 0) {
      inp.placeholder = `🎙️ ${isLive ? 'LIVE' : 'LISTENING'} | CrossPC Sent:${sentCrossPC} | Heard:${heardCrossPC}`;
    }
  }, 350);
})();
</script>
<script>
/* ==========================================================================
   MODULE 65: FLICKER-FREE CHAT BAR + DIRECT CROSS-PC MQTT WALKIE-TALKIE
   ========================================================================== */
(function initCleanMqttWalkieTalkie() {
  const mySenderTag = 'wk65_' + Math.random().toString(36).slice(2, 9);
  let outAudioCtx = null;
  let playCursor = 0;


  function unlockSpeakers() {
    if (!outAudioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      outAudioCtx = new Ctx();
    }
    if (outAudioCtx.state === 'suspended') outAudioCtx.resume();
    return outAudioCtx;
  }


  document.addEventListener('click', unlockSpeakers);


  function playReceivedChunk(b64, sampleRate) {
    try {
      const ctx = unlockSpeakers();
      const raw = atob(b64);
      const u8 = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
      const i16 = new Int16Array(u8.buffer);
      if (i16.length === 0) return;


      const audioBuf = ctx.createBuffer(1, i16.length, sampleRate || 16000);
      const f32 = audioBuf.getChannelData(0);
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;


      const src = ctx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(ctx.destination);


      const now = ctx.currentTime;
      if (playCursor < now) playCursor = now + 0.03;
      src.start(playCursor);
      playCursor += audioBuf.duration;


      // Trigger floating 🎙️ icon over remote speaking cat (Module 51 hook)
      window._wkRemoteHeardAt = Date.now();
    } catch (e) {}
  }


  // Receive voice packets from Module 59's working MQTT bus
  const prevSig65 = window._onGlobalPeerSig;
  window._onGlobalPeerSig = function(pkt) {
    if (pkt && pkt.kind === 'wk65_audio' && pkt.sender !== mySenderTag) {
      if (activeGameId === 'warrior-online') {
        playReceivedChunk(pkt.b64, pkt.sr);
      }
      return;
    }
    if (prevSig65) prevSig65(pkt);
  };


  // Keep chat bar placeholder completely clean & flicker-free
  setInterval(() => {
    const inp = document.getElementById('cwc-input');
    if (inp && inp.placeholder.includes('|')) {
      inp.placeholder = 'Press ENTER to chat with the Clan...';
    }
  }, 150);


  // Bind a fresh, standalone Walkie-Talkie handler to #cwc-mic
  setInterval(() => {
    const micBtn = document.getElementById('cwc-mic');
    if (!micBtn || micBtn.dataset.wk65 === '1') return;
    micBtn.dataset.wk65 = '1';


    let live = false;
    let stream = null;
    let capCtx = null;
    let proc = null;


    // Clone button once to wipe all old conflicting listeners (Modules 42, 47, 48)
    const freshBtn = micBtn.cloneNode(true);
    freshBtn.dataset.wk65 = '1';
    micBtn.parentNode.replaceChild(freshBtn, micBtn);


    freshBtn.addEventListener('click', async () => {
      if (live) {
        live = false;
        if (proc) proc.disconnect();
        if (capCtx) capCtx.close().catch(() => {});
        if (stream) stream.getTracks().forEach(t => t.stop());
        freshBtn.textContent = '🎙️ Mic: OFF';
        freshBtn.style.background = 'rgba(255, 0, 127, 0.18)';
        freshBtn.style.borderColor = '#ff007f';
        freshBtn.style.color = '#ff007f';
        return;
      }


      try {
        unlockSpeakers();
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        live = true;


        const Ctx = window.AudioContext || window.webkitAudioContext;
        capCtx = new Ctx({ sampleRate: 16000 });
        if (capCtx.state === 'suspended') await capCtx.resume();


        const src = capCtx.createMediaStreamSource(stream);
        proc = capCtx.createScriptProcessor(2048, 1, 1);


        proc.onaudioprocess = ev => {
          if (!live) return;
          const floats = ev.inputBuffer.getChannelData(0);
          let peak = 0;
          const i16 = new Int16Array(floats.length);
          for (let i = 0; i < floats.length; i++) {
            const s = Math.max(-1, Math.min(1, floats[i]));
            if (Math.abs(s) > peak) peak = Math.abs(s);
            i16[i] = s < 0 ? s * 32768 : s * 32767;
          }


          if (peak > 0.015 && window.nexusGlobalBroadcast) {
            window._wkLocalSpokeAt = Date.now();
            const u8 = new Uint8Array(i16.buffer);
            let bin = '';
            for (let b = 0; b < u8.length; b++) bin += String.fromCharCode(u8[b]);


            window.nexusGlobalBroadcast('peer_sig', {
              kind: 'wk65_audio',
              sender: mySenderTag,
              b64: btoa(bin),
              sr: capCtx.sampleRate
            });
          }
        };


        const zeroGain = capCtx.createGain();
        zeroGain.gain.value = 0;
        src.connect(proc);
        proc.connect(zeroGain);
        zeroGain.connect(capCtx.destination);


        freshBtn.textContent = '🎙️ Mic: LIVE';
        freshBtn.style.background = '#00ff88';
        freshBtn.style.borderColor = '#00ff88';
        freshBtn.style.color = '#000';
      } catch (err) {
        freshBtn.textContent = '⚠️ Mic Blocked';
      }
    });
  }, 400);


  // Cleanly show floating 🎙️ over speaking cat's nameplate using _wkLocalSpokeAt / _wkRemoteHeardAt
  const baseFillText65 = CanvasRenderingContext2D.prototype.fillText;
  CanvasRenderingContext2D.prototype.fillText = function(text, x, y, ...rest) {
    baseFillText65.call(this, text, x, y, ...rest);
    if (activeGameId === 'warrior-online' && x === 0 && y === -22 && typeof text === 'string') {
      const now = Date.now();
      const isMe = (this.fillStyle === '#00ff88');
      const active = isMe ? (now - (window._wkLocalSpokeAt || 0) < 450) : (now - (window._wkRemoteHeardAt || 0) < 450);
      if (active) {
        baseFillText65.call(this, '🎙️', 0, -38 + Math.sin(now / 110) * 2);
      }
    }
  };
})();
